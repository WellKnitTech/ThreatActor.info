version: "1"
policy: "data/observable-source-policy.yml"
scenarios:
  - id: "same-report-is-not-actor-proof"
    source: "aptnotes"
    input: "report contains Actor A name and an IPv4 address"
    expected: "quarantine_actor_linkage"
    reason: "report index/co-occurrence cannot create actor ownership"
  - id: "malware-name-is-not-actor-proof"
    source: "threatfox"
    input: "IOC malware_name equals a malware family associated with Actor A"
    expected: "unassigned_or_malware_mediated"
    reason: "malware-mediated evidence needs an independently reviewed two-hop relationship"
  - id: "threatfox-explicit-reviewed-link"
    source: "threatfox"
    input: "record ID, report URL, IOC, and reviewed direct actor mapping"
    expected: "publish_actor_link"
    reason: "record-level evidence and explicit mapping satisfy direct-link gate"
  - id: "threatfox-unmatched"
    source: "threatfox"
    input: "valid IOC with no actor mapping"
    expected: "publish_unassigned_or_quarantine"
    reason: "safe unassigned publication is allowed; actor view is forbidden"
  - id: "conflicting-claims"
    source: "threatfox"
    input: "same normalized IOC has two incompatible actor claims"
    expected: "quarantine"
    reason: "priority cannot resolve attribution conflicts"
  - id: "stale-fallback"
    source: "threatfox"
    input: "API failure with last known snapshot older than max_age_days"
    expected: "quarantine_new_rows_and_block_health"
    reason: "expired fallback cannot publish or appear healthy"
  - id: "unauthorized-source"
    source: "malwarebazaar"
    input: "401 or missing terms authorization"
    expected: "quarantine_and_unhealthy"
    reason: "unauthorized/unclear-rights input is not publishable"
  - id: "rate-limited-source"
    source: "urlhaus"
    input: "HTTP 429"
    expected: "retry_then_quarantine"
    reason: "rate limit is not a successful empty response"
  - id: "raw-sample"
    source: "malwarebazaar"
    input: "sample bytes or download URL"
    expected: "reject"
    reason: "policy permits metadata/hashes only, never samples"
  - id: "false-positive"
    source: "feodo-tracker"
    input: "source correction marks an IP false positive"
    expected: "source_scoped_quarantine"
    reason: "preserve evidence while suppressing publication"
  - id: "cve-context"
    source: "cisa-kev"
    input: "CVE listed as exploited"
    expected: "publish_enrichment_not_actor_ioc"
    reason: "vulnerability context cannot attach an actor"
  - id: "malformed-value"
    source: "threatfox"
    input: "invalid IP/hash/URL or unsupported type"
    expected: "reject_validation"
    reason: "Observable v1 validation is fail-closed"
