# OCD ransomware-map → ThreatActor.info entity reconciliation overrides.
# Analyst-curated. Exact automated matches do not need entries here.
# Schema per entry:
#   target_slug: actor url slug without leading slash
#   target_malware_slug: optional malware slug
#   confidence: high|medium|low
#   entity_type: operation|ransomware_family|affiliate_group|malware_strain|unknown
#   reason: free text
#   allow_merge: false by default; only meaningful for accepted+high

accepted:
  # Editorial alias already common in RansomLook overrides.
  "ALPHV":
    target_slug: blackcat
    confidence: high
    entity_type: operation
    reason: "Well-known ALPHV ≡ BlackCat operation alias"
  "lockbit3":
    target_slug: lockbit
    confidence: high
    entity_type: operation
    reason: "RansomLook-style lockbit3 key maps to LockBit operation (provenance only)"
  "lockbit4":
    target_slug: lockbit
    confidence: high
    entity_type: operation
    reason: "RansomLook-style lockbit4 key maps to LockBit operation (provenance only)"

rejected:
  "affiliation":
    confidence: low
    reason: "Plate chrome / English word, not an entity"
  "collaboration":
    confidence: low
    reason: "Plate chrome / English word, not an entity"
  "Decryptor released":
    confidence: low
    reason: "Event phrase, not an actor label"

needs_review:
