    reason: "Conti-code LockBit Green lineage node; family variant, not auto-merge"
  "Black Basta":
    target_slug: blackbasta
    confidence: medium
    entity_type: operation
    reason: "Conti-derived successor narrative requires analyst confirmation of identity continuity"

deprecated:
  "ABCD":
    target_slug: lockbit
    confidence: medium
    entity_type: ransomware_family
    reason: "Historical LockBit predecessor brand; keep as deprecated alias evidence, do not revive page"
  "ABCD Ransomware":
