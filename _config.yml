title: "Threat Actor Info"
description: "An attempt at a community wiki about threat actors"
logo: "/assets/images/TAInfoTransparentGlow.png"
baseurl: "" # Your base URL
url: "https://threatactor.info" # Your site URL
theme: jekyll-theme-hacker
sass:
  quiet_deps: true

collections:
  threat_actors:
    output: true
    permalink: /:path/
  malware:
    output: true
    permalink: /malware/:path/
  techniques:
    output: true
    permalink: /techniques/:path/
  tactics:
    output: true
    permalink: /tactics/:path/
  campaigns:
    output: true
    permalink: /campaigns/:path/
  mitigations:
    output: true
    permalink: /mitigations/:path/

# Collection markdown bodies are generated prose (importers / generate-pages), not
# Liquid templates. Disable Liquid rendering so stray {{...}} / {%...%} from upstream
# intel sources cannot break `jekyll build --safe`. Layouts still render with Liquid.
defaults:
  - scope:
      path: ""
      type: threat_actors
    values:
      render_with_liquid: false
  - scope:
      path: ""
      type: malware
    values:
      render_with_liquid: false
  - scope:
      path: ""
      type: techniques
    values:
      render_with_liquid: false
  - scope:
      path: ""
      type: tactics
    values:
      render_with_liquid: false
  - scope:
      path: ""
      type: campaigns
    values:
      render_with_liquid: false
  - scope:
      path: ""
      type: mitigations
    values:
      render_with_liquid: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 5
paginate_path: "/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
