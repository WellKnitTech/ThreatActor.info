name: Probe CISA Feeds

on:
  workflow_dispatch:
  # Also on PRs that touch the news/CISA fetch path so we can live-verify
  # from GitHub-hosted runners (where the intermittent Akamai 403 appears).
  pull_request:
    paths:
      - 'scripts/lib/news_feed.rb'
      - 'scripts/fetch-news.rb'
      - 'scripts/probe-cisa-feeds.rb'
      - 'test/fetch_news_cisa_fallback_test.rb'
      - 'test/news_feed_test.rb'
      - '.github/workflows/probe-cisa-feeds.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.5'
          bundler-cache: true

      - name: Unit tests (news / CISA fallback)
        run: |
          bundle exec ruby test/news_feed_test.rb
          bundle exec ruby test/fetch_news_parse_deadline_test.rb
          bundle exec ruby test/fetch_news_cisa_fallback_test.rb

      - name: Live-probe CISA feed URLs
        run: ruby scripts/probe-cisa-feeds.rb
