---
name: Weekly Threat Data

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source key to rerun (blank runs every source)'
        required: false
        default: ''
        type: string
      phase:
        description: 'Pipeline phase to run'
        required: false
        default: all
        type: choice
        options: [all, fetch, plan, import]
      allow_anomalies:
        description: 'Apply plan-threshold anomalous sources instead of quarantining them'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update-data:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/import-pipeline.yml
    with:
      source: ${{ inputs.source || '' }}
      phase: ${{ inputs.phase || 'all' }}
      allow_anomalies: ${{ inputs.allow_anomalies || false }}
    secrets: inherit
