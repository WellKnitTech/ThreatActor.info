name: Canonical Threat Data Import Pipeline

on:
  workflow_call:
    inputs:
      source:
        description: 'Source key to rerun (blank runs every source)'
        required: false
        default: ''
        type: string
      phase:
        description: 'Pipeline phase to run'
        required: false
        default: all
        type: string
      limit:
        description: 'Optional source record limit for supported fetchers'
        required: false
        default: ''
        type: string
    secrets:
      THREATFOX_API_KEY:
        required: false

concurrency:
  group: threat-data-import-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: data-import
    permissions:
      contents: write
      pull-requests: write
    env:
      IMPORT_REPORT_DIR: tmp/import-reports
      FAILURE_DIAGNOSTICS_DIR: tmp/failure-diagnostics

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.5'
          bundler-cache: true

      - name: Capture actor baseline
        run: |
          mkdir -p tmp/delta-baseline
          cp -R _data/actors tmp/delta-baseline/actors

      - name: Run automated source imports with bounded retries
        id: imports
        env:
          THREATFOX_API_KEY: ${{ secrets.THREATFOX_API_KEY }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_PHASE: ${{ inputs.phase || 'all' }}
          REQUESTED_LIMIT: ${{ inputs.limit || '' }}
          IMPORT_JOB_DEADLINE_SECONDS: '2400'
          IMPORT_SOURCE_DEADLINE_SECONDS: '600'
          IMPORT_DETAIL_DEADLINE_SECONDS: '10'
          IMPORT_SOURCE_MAX_ATTEMPTS: '3'
          IMPORT_RETRY_SLEEP_CAP_SECONDS: '30'
        run: |
          set -u
          export IMPORT_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "IMPORT_STARTED_AT=$IMPORT_STARTED_AT" >> "$GITHUB_ENV"
          mkdir -p "$IMPORT_REPORT_DIR" "$FAILURE_DIAGNOSTICS_DIR" data/imports
          args=(--report-dir "$IMPORT_REPORT_DIR" --metrics-json tmp/performance-metrics.json --date "$(date -u +%F)")
          if [[ -n "$REQUESTED_SOURCE" ]]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [[ -n "$REQUESTED_LIMIT" ]]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          case "$REQUESTED_PHASE" in
            all) args+=(--apply) ;;
            fetch) args+=(--fetch-only) ;;
            plan) args+=(--plan-only) ;;
            import) args+=(--no-fetch --apply) ;;
            *)
              printf '{"error":"invalid phase","phase":"%s"}\n' "$REQUESTED_PHASE" > "$FAILURE_DIAGNOSTICS_DIR/invalid-input.json"
              exit 2
              ;;
          esac

          : > tmp/import-run.log
          set +e
          bundle exec ruby scripts/import-automated-sources.rb "${args[@]}" 2>&1 | tee -a tmp/import-run.log
          status=${PIPESTATUS[0]}
          set -e

          EXIT_CODE="$status" DIAGNOSTIC_PATH="$FAILURE_DIAGNOSTICS_DIR/import-run.json" REQUESTED_PHASE="$REQUESTED_PHASE" REQUESTED_SOURCE="$REQUESTED_SOURCE" \
            ruby -rjson -e 'log = File.exist?("tmp/import-run.log") ? File.read("tmp/import-run.log").strip : nil; payload = { phase: ENV.fetch("REQUESTED_PHASE"), source: ENV.fetch("REQUESTED_SOURCE", ""), retry_scope: "per-source", attempts: 1, exit_code: ENV.fetch("EXIT_CODE") }; payload[:error] = log if ENV.fetch("EXIT_CODE") != "0" && !log.nil? && !log.empty?; File.write(ENV.fetch("DIAGNOSTIC_PATH"), JSON.pretty_generate(payload))'
          echo "IMPORT_ATTEMPTS=1" >> "$GITHUB_ENV"
          echo "IMPORT_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          exit "$status"

      - name: Check source freshness
        if: ${{ success() }}
        run: ruby scripts/check-source-freshness.rb --mode warn --report-json tmp/source-freshness-report.json

      - name: Summarize source health
        if: ${{ always() }}
        env:
          FAIL_ON_SOURCE_FAILURE: '1'
        run: |
          ruby scripts/summarize-import-health.rb "$IMPORT_REPORT_DIR" tmp/import-health.md "$FAILURE_DIAGNOSTICS_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Evaluate source deltas
        if: ${{ success() && (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'import') }}
        run: |
          ruby scripts/evaluate-source-deltas.rb \
            --current _data/actors \
            --previous tmp/delta-baseline/actors \
            --report-json tmp/source-delta-report.json \
            --max-change-ratio 4.00 \
            --max-identity-change-ratio 0.02

      - name: Validate JSON schemas
        if: ${{ success() && (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'import') }}
        run: ruby scripts/validate-json-schemas.rb

      - name: Validate content
        if: ${{ success() && (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'import') }}
        run: ruby scripts/validate-content.rb

      - name: Build site
        if: ${{ success() && (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'import') }}
        run: bundle exec jekyll build --safe

      - name: Verify workflow merge safety
        if: ${{ always() }}
        run: ruby scripts/verify-weekly-data-workflow.rb .github/workflows/import-pipeline.yml

      - name: Write standardized import evidence
        if: ${{ always() }}
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_PHASE: ${{ inputs.phase || 'all' }}
          IMPORT_STATUS: ${{ job.status == 'cancelled' && 'cancelled' || job.status == 'failure' && 'failed' || 'completed' }}
          IMPORT_ERROR_CLASS: ${{ job.status }}
          GITHUB_JOB_STATUS: ${{ job.status }}
          SOURCE_VERSION: ${{ github.sha }}
          CACHE_DECISION: 'bundler-cache-configured'
          REQUEST_COUNT: ${{ env.REQUEST_COUNT || '0' }}
          FALLBACK_STATUS: 'not_used'
          IMPORT_REPORT_DIR: ${{ env.IMPORT_REPORT_DIR }}
          FAILURE_DIAGNOSTICS_DIR: ${{ env.FAILURE_DIAGNOSTICS_DIR }}
        run: ruby scripts/write-import-evidence.rb tmp/import-evidence.json

      - name: Upload source snapshots, reports, and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-source-run-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            data/imports/**
            ${{ env.IMPORT_REPORT_DIR }}/**
            ${{ env.FAILURE_DIAGNOSTICS_DIR }}/**
            tmp/import-run.log
            tmp/import-health.md
            tmp/source-delta-report.json
            tmp/performance-metrics.json
            tmp/import-evidence.json
            tmp/cache-manifest.json
            tmp/source-freshness-report.json
            _data/generated/source_freshness.json

      - name: Open weekly data pull request
        if: ${{ success() && (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'import') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No weekly data changes detected."
            exit 0
          fi

          branch="automated/weekly-data-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add _data/actors _threat_actors _data/generated _malware api data/imports tmp/source-delta-report.json
          git commit -m "Weekly threat data refresh"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Weekly threat data refresh" \
            --body-file tmp/import-health.md

          # Queue normal protected auto-merge; never bypass branch rules.
          gh pr merge "$branch" --auto --squash --delete-branch
