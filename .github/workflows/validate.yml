name: Content Validation
permissions:
  contents: read
  pages: read
  statuses: read


on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify workflow dependency policy
      run: ruby scripts/verify-workflow-dependency-policy.rb

    - name: Set up importer prerequisites
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install importer prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes poppler-utils
        python -m pip install --requirement requirements-importers.txt

    - name: Run Python importer tests
      run: python -m unittest discover -s test -p 'test_ocd_entity_reconciler.py' -v
      
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.5'
        bundler-cache: true
        
    - name: Check source freshness
      run: ruby scripts/check-source-freshness.rb --mode warn --report-json tmp/source-freshness-report.json

    - name: Import runner contract and workflow safety
      run: |
        ruby scripts/verify-weekly-data-workflow.rb
        ruby scripts/verify-import-sources-workflow.rb
        ruby scripts/test-import-runner-contract.rb

    - name: Import deadline phase regression
      run: bundle exec ruby test/import_deadline_phases_test.rb

    - name: Import soft-fail runner regression
      run: bundle exec ruby test/bounded_source_runner_critical_test.rb

    - name: Import health test command failure
      run: |
        set +e
        bundle exec ruby scripts/test-import-health.rb --name test_command_failure_is_reported_as_failed_and_not_healthy > /tmp/health-test.out 2>&1
        code=$?
        cat /tmp/health-test.out
        cat /tmp/health-test.out >> "$GITHUB_STEP_SUMMARY"
        exit $code

    - name: Import health test degraded enrichment
      run: |
        set +e
        bundle exec ruby scripts/test-import-health.rb --name test_degraded_enrichment_does_not_fail_health_summary > /tmp/health-test.out 2>&1
        code=$?
        cat /tmp/health-test.out
        cat /tmp/health-test.out >> "$GITHUB_STEP_SUMMARY"
        exit $code

    - name: Import health test evidence names
      run: bundle exec ruby scripts/test-import-health.rb --name test_standardized_evidence_names_failed_sources

    - name: Import health test diagnostic reporting
      run: |
        set +e
        bundle exec ruby scripts/test-import-health.rb --name test_command_failure_diagnostic_is_reported_by_health_and_evidence > /tmp/health-test.out 2>&1
        code=$?
        cat /tmp/health-test.out
        cat /tmp/health-test.out >> "$GITHUB_STEP_SUMMARY"
        exit $code

    - name: Import health test pipeline contract
      run: bundle exec ruby scripts/test-import-health.rb --name test_canonical_pipeline_keeps_health_and_evidence_on_failure

    # Mirrors scripts/validate.sh: generators → JSON schemas → content → jekyll doctor → build → parse api/*.json
    - name: Full validation pipeline
      run: bash scripts/validate.sh

    - name: Upload source freshness report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: source-freshness-report-${{ github.run_id }}
        path: |
          tmp/source-freshness-report.json
          _data/generated/source_freshness.json
