name: Content Validation
permissions:
  contents: read
  pages: read
  statuses: read


on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Manual runs, plus post-push dispatch from weekly import merges and the
  # daily news job (GITHUB_TOKEN commits do not fire push-triggered workflows).
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify workflow dependency policy
      run: ruby scripts/verify-workflow-dependency-policy.rb

    - name: Set up importer prerequisites
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install importer prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes poppler-utils
        python -m pip install --requirement requirements-importers.txt

    - name: Run Python importer tests
      run: python -m unittest discover -s test -p 'test_ocd_entity_reconciler.py' -v

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.5'
        bundler-cache: true

    - name: Check source freshness
      run: ruby scripts/check-source-freshness.rb --mode warn --report-json tmp/source-freshness-report.json

    # Mirrors scripts/validate.sh: generators → JSON schemas → content → jekyll doctor → build → parse api/*.json
    - name: Full validation pipeline
      id: validate
      run: |
        set -o pipefail
        bash scripts/validate.sh 2>&1 | tee validate-output.log

    # Surface a readable failure tail via check-run annotations when Actions
    # log blobs are unavailable to local agents (egress-restricted VMs).
    - name: Annotate validate failure tail
      if: failure() && steps.validate.outcome == 'failure'
      run: |
        if [ ! -f validate-output.log ]; then
          echo '::error::validate.sh failed but validate-output.log was missing'
          exit 0
        fi
        {
          echo '## validate.sh failure tail'
          echo
          echo '```'
          tail -n 80 validate-output.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        compact="$(tail -n 40 validate-output.log | tr '\n' '|' | tr -s '|' | cut -c1-650)"
        echo "::error title=validate.sh failure::${compact}"

    - name: Upload source freshness report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: source-freshness-report-${{ github.run_id }}
        path: |
          tmp/source-freshness-report.json
          _data/generated/source_freshness.json
          validate-output.log
