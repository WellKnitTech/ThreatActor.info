---
name: Automated Source Imports

# Legacy manual entry point. Broad scheduled imports live only in Weekly Threat Data.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional single source key'
        required: false
        default: ''
        type: string
      phase:
        description: 'Pipeline phase to run'
        required: false
        default: all
        type: choice
        options: [all, fetch, plan, import]
      limit:
        description: 'Optional source record limit for supported fetchers'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  import:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/import-pipeline.yml
    with:
      source: ${{ inputs.source || '' }}
      phase: ${{ inputs.phase || 'all' }}
      limit: ${{ inputs.limit || '' }}
    secrets: inherit
