campaigns:
  - name: "SPACEHOP Activity"
    campaign_id: "C0052"
    url: "https://attack.mitre.org/campaigns/C0052"
    stix_id: "campaign--83e1f587-34da-44cc-b65b-a72479cb1616"
    description: "SPACEHOP Activity is conducted through commercially leased Virtual Private Servers (VPS), otherwise known as provisioned Operational Relay Box (ORB) networks. The network leveraged for SPACEHOP Activity enabled China-nexus cyber threat actors – such as APT5 and Ke3chang – to perform network reconnaissance scanning and vulnerability exploitation. SPACEHOP Activity has historically targeted entities in North America, Europe, and the Middle East.(Citation: ORB Mandiant) "
