name: "Ke3chang"
aliases: ["APT15","BRONZE DAVENPORT","BRONZE IDLEWOOD","BRONZE PALACE","G0004","GREF","Ke3chang","ke3chang","Ke3Chang","Lurid","Metushy","Mirage","NICKEL","Nylon Typhoon","Playful Dragon","Red Vulture","RedRiver","Royal APT","RoyalAPT","Social Network Team","Vixen Panda","VIXEN PANDA","RIVER CASTLE"]
description: "Ke3chang is a threat group attributed to actors operating out of China. Ke3chang has targeted oil, government, diplomatic, military, and NGOs in Central and South America, the Caribbean, Europe, and North America since at least 2010. [Mandiant Operation Ke3chang November 2014](https://www.mandiant.com/resources/operation-ke3chang-targeted-attacks-against-ministries-of-foreign-affairs) [NCC Group APT15 Alive and Strong](https://research.nccgroup.com/2018/03/10/apt15-is-alive-and-strong-an-analysis-of-royalcli-and-royaldns/) [APT15 Intezer June 2018](https://web.archive.org/web/20180615122133/https://www.intezer.com/miragefox-apt15-resurfaces-with-new-tools-based-on-old-ones/) [Microsoft NICKEL December 2021](https://www.microsoft.com/security/blog/2021/12/06/nickel-targeting-government-organizations-across-latin-america-and-europe)"
