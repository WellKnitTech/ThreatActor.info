name: "Operation Rusty Flag"
aliases: ["Operation Rusty Flag"]
description: "(Deep Instinct) The operation has at least two different initial access vectors. The operation is not associated with a known threat actor; the operation was instead named because of their novel malware written in the Rust programming language. One of the lures used in the operation is a modified document that was used by the 'Tropical Scorpius, RomCom' group. This could be a deliberate “false flag”."
