  stix_id: malware--76abb3ef-dafd-4762-97cb-a35379429db4
  description: 'Gazer is a backdoor used by Turla since at least 2016. (Citation:
    ESET Gazer Aug 2017)'
- name: Kazuar
  mitre_id: S0265
  url: https://attack.mitre.org/software/S0265
  type: malware
  stix_id: malware--536be338-e2ef-4a6b-afb6-8d5568b91eb2
  description: 'Kazuar is a fully featured, multi-platform backdoor Trojan written
    using the Microsoft .NET framework. (Citation: Unit 42 Kazuar May 2017)'
- name: Systeminfo
  mitre_id: S0096
  url: https://attack.mitre.org/software/S0096
  type: tool
  stix_id: tool--7fcbc4e8-1989-441f-9ac5-e7b6ff5806f1
  description: 'Systeminfo is a Windows utility that can be used to gather detailed
    information about a computer. (Citation: TechNet Systeminfo)'
- name: LightNeuron
  mitre_id: S0395
  url: https://attack.mitre.org/software/S0395
  type: malware
  stix_id: malware--6ba1d7ae-d60b-43e6-9f08-a8b787e9d9cb
  description: 'LightNeuron is a sophisticated backdoor that has targeted Microsoft
    Exchange servers since at least 2014. LightNeuron has been used by Turla to target
    diplomatic and foreign affairs-related organizations. The presence of certain
    strings in the malware suggests a Linux variant of LightNeuron exists.(Citation:
    ESET LightNeuron May 2019)'
- name: Carbon
  mitre_id: S0335
  url: https://attack.mitre.org/software/S0335
  type: malware
  stix_id: malware--b7e9880a-7a7c-4162-bddb-e28e8ef2bf1f
  description: 'Carbon is a sophisticated, second-stage backdoor and framework that
    can be used to steal sensitive information from victims. Carbon has been selectively
    used by Turla to target government and foreign affairs-related organizations in
    Central Asia.(Citation: ESET Carbon Mar 2017)(Citation: Securelist Turla Oct 2018)'
- name: Mimikatz
  mitre_id: S0002
  url: https://attack.mitre.org/software/S0002
  type: tool
  stix_id: tool--afc079f3-c0ea-4096-b75d-3f05338b7f60
  description: 'Mimikatz is a credential dumper capable of obtaining plaintext Windows
    account logins and passwords, along with many other features that make it useful
    for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity
    Mimikatz Guide)'
- name: Tasklist
  mitre_id: S0057
  url: https://attack.mitre.org/software/S0057
  type: tool
  stix_id: tool--2e45723a-31da-4a7e-aaa6-e01998a6788f
  description: 'The Tasklist utility displays a list of applications and services
    with their Process IDs (PID) for all tasks running on either a local or a remote
    computer. It is packaged with Windows operating systems and can be executed from
    the command-line interface. (Citation: Microsoft Tasklist)'
- name: LunarMail
  mitre_id: S1142
  url: https://attack.mitre.org/software/S1142
  type: malware
  stix_id: malware--a5789a26-2b7b-4b2d-a25f-31182468d4bb
  description: 'LunarMail is a backdoor that has been used by Turla since at least
    2020 including in a compromise of a European ministry of foreign affairs (MFA)
    in conjunction with LunarLoader and LunarWeb. LunarMail is designed to be deployed
    on workstations and can use email messages and Steganography in command and control.(Citation:
    ESET Turla Lunar toolset May 2024)'
- name: Net
  mitre_id: S0039
  url: https://attack.mitre.org/software/S0039
  type: tool
  stix_id: tool--03342581-f790-4f03-ba41-e82e67392e23
  description: |-
    The Net utility is a component of the Windows operating system. It is used in command-line operations for control of users, groups, services, and network connections. (Citation: Microsoft Net Utility)

    Net has a great deal of functionality, (Citation: Savill 1999) much of which is useful for an adversary, such as gathering system and network information for Discovery, moving laterally through SMB/Windows Admin Shares using <code>net use</code> commands, and interacting with services. The net1.exe
- name: Reg
  mitre_id: S0075
  url: https://attack.mitre.org/software/S0075
  type: tool
  stix_id: tool--cde2d700-9ed1-46cf-9bce-07364fe8b24f
  description: |-
    Reg is a Windows utility used to interact with the Windows Registry. It can be used at the command-line interface to query, add, modify, and remove information. (Citation: Microsoft Reg)

    Utilities such as Reg are known to be used by persistent threats. (Citation: Windows Commands JPCERT)
- name: HyperStack
  mitre_id: S0537
  url: https://attack.mitre.org/software/S0537
  type: malware
  stix_id: malware--2cf7dec3-66fc-423f-b2c7-58f1de243b4e
  description: 'HyperStack is a RPC-based backdoor used by Turla since at least 2018.
    HyperStack has similarities to other backdoors used by Turla including Carbon.(Citation:
    Accenture HyperStack October 2020)'
- name: Epic
  mitre_id: S0091
  url: https://attack.mitre.org/software/S0091
  type: malware
  stix_id: malware--6b62e336-176f-417b-856a-8552dd8c44e1
  description: 'Epic is a backdoor that has been used by Turla. (Citation: Kaspersky
    Turla)'
- name: NBTscan
  mitre_id: S0590
  url: https://attack.mitre.org/software/S0590
  type: tool
  stix_id: tool--b63970b7-ddfb-4aee-97b1-80d335e033a8
  description: 'NBTscan is an open source tool that has been used by state groups
    to conduct internal reconnaissance within a compromised network.(Citation: Debian
    nbtscan Nov 2019)(Citation: SecTools nbtscan June 2003)(Citation: Symantec Waterbug
    Jun 2019)(Citation: FireEye APT39 Jan 2019)'
- name: TinyTurla
  mitre_id: S0668
  url: https://attack.mitre.org/software/S0668
  type: malware
  stix_id: malware--2a7c1bb7-cd12-456e-810d-ab3bf8457bab
  description: 'TinyTurla is a backdoor that has been used by Turla against targets
    in the US, Germany, and Afghanistan since at least 2020.(Citation: Talos TinyTurla
    September 2021)'
- name: Penquin
  mitre_id: S0587
  url: https://attack.mitre.org/software/S0587
  type: malware
  stix_id: malware--d18cb958-f4ad-4fb3-bb4f-e8994d206550
  description: 'Penquin is a remote access trojan (RAT) with multiple versions used
    by Turla to target Linux systems since at least 2014.(Citation: Kaspersky Turla
    Penquin December 2014)(Citation: Leonardo Turla Penquin May 2020)'
- name: LunarLoader
  mitre_id: S1143
  url: https://attack.mitre.org/software/S1143
  type: malware
  stix_id: malware--6490afef-d88e-4e2b-b9d9-a472508ca59d
  description: 'LunarLoader is the loader component for the LunarWeb and LunarMail
    backdoors that has been used by Turla since at least 2020 including against a
    European ministry of foreign affairs (MFA). LunarLoader has been observed as a
    standalone and as a part of trojanized open-source software such as AdmPwd.(Citation:
    ESET Turla Lunar toolset May 2024)'
