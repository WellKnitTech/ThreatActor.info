  Federal Security Service (FSB). They have compromised victims in over 50 countries
  since at least 2004, spanning a range of industries including government, embassies,
  military, education, research and pharmaceutical companies. Turla is known for conducting
  watering hole and spearphishing campaigns, and leveraging in-house tools and malware,
  such as Uroburos. [Kaspersky Turla](https://securelist.com/the-epic-turla-operation/65545/)
