software:
  - name: "Milan"
    mitre_id: "S1015"
    url: "https://attack.mitre.org/software/S1015"
    type: "malware"
    stix_id: "malware--aea6d6b8-d832-4c90-a1bb-f52c6684db6c"
    description: "Milan is a backdoor implant based on DanBot that was written in Visual C++ and .NET. Milan has been used by HEXANE since at least June 2020.(Citation: ClearSky Siamesekitten August 2021)(Citation: Kaspersky Lyceum October 2021)"
  - name: "Ping"
    mitre_id: "S0097"
    url: "https://attack.mitre.org/software/S0097"
    type: "tool"
    stix_id: "tool--b77b563c-34bb-4fb8-86a3-3694338f7b47"
    description: "Ping is an operating system utility commonly used to troubleshoot and verify network connections. (Citation: TechNet Ping)"
  - name: "netstat"
    mitre_id: "S0104"
    url: "https://attack.mitre.org/software/S0104"
    type: "tool"
    stix_id: "tool--4664b683-f578-434f-919b-1c1aad2a1111"
    description: "netstat is an operating system utility that displays active TCP connections, listening ports, and network statistics. (Citation: TechNet Netstat)"
  - name: "BITSAdmin"
    mitre_id: "S0190"
    url: "https://attack.mitre.org/software/S0190"
    type: "tool"
    stix_id: "tool--64764dc6-a032-495f-8250-1e4c06bdc163"
    description: "BITSAdmin is a command line tool used to create and manage BITS Jobs. (Citation: Microsoft BITSAdmin)"
  - name: "Shark"
    mitre_id: "S1019"
    url: "https://attack.mitre.org/software/S1019"
    type: "malware"
    stix_id: "malware--99854cc8-f202-4e03-aa0a-4f8a4af93229"
    description: "Shark is a backdoor malware written in C# and .NET that is an updated version of Milan; it has been used by HEXANE since at least July 2021.(Citation: ClearSky Siamesekitten August 2021)(Citation: Accenture Lyceum Targets November 2021)"
  - name: "DnsSystem"
    mitre_id: "S1021"
    url: "https://attack.mitre.org/software/S1021"
    type: "malware"
    stix_id: "malware--8a2867f9-e8fc-4bf1-a860-ef6e46311900"
    description: "DnsSystem is a .NET based DNS backdoor, which is a customized version of the open source tool DIG.net, that has been used by HEXANE since at least June 2022.(Citation: Zscaler Lyceum DnsSystem June 2022)"
  - name: "DanBot"
    mitre_id: "S1014"
    url: "https://attack.mitre.org/software/S1014"
    type: "malware"
    stix_id: "malware--b8d48deb-450c-44f6-a934-ac8765aa89cb"
    description: "DanBot is a first-stage remote access Trojan written in C# that has been used by HEXANE since at least 2018.(Citation: SecureWorks August 2019)"
  - name: "Empire"
    mitre_id: "S0363"
    url: "https://attack.mitre.org/software/S0363"
    type: "tool"
    stix_id: "tool--3433a9e8-1c47-4320-b9bf-ed449061d1c3"
    description: "Empire is an open-source, cross-platform remote administration and post-exploitation framework that is publicly available on GitHub. While the tool itself is primarily written in Python, the post-exploitation agents are written in pure PowerShell for Windows and Python for Linux/macOS. Empire was one of five tools singled out by a joint report on public hacking tools being widely used by adversaries.(Citation: NCSC Joint Report Public Tools)(Citation: Github PowerShell Empire)(Citation: GitHub AT"
  - name: "ipconfig"
    mitre_id: "S0100"
    url: "https://attack.mitre.org/software/S0100"
    type: "tool"
    stix_id: "tool--294e2560-bd48-44b2-9da2-833b5588ad11"
    description: "ipconfig is a Windows utility that can be used to find information about a system's TCP/IP, DNS, DHCP, and adapter configuration. (Citation: TechNet Ipconfig)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "Kevin"
    mitre_id: "S1020"
    url: "https://attack.mitre.org/software/S1020"
    type: "malware"
    stix_id: "malware--e7863f5d-cb6a-4f81-8804-0a635eec160a"
    description: "Kevin is a backdoor implant written in C++ that has been used by HEXANE since at least June 2020, including in operations against organizations in Tunisia.(Citation: Kaspersky Lyceum October 2021)"
  - name: "PoshC2"
    mitre_id: "S0378"
    url: "https://attack.mitre.org/software/S0378"
    type: "tool"
    stix_id: "tool--4b57c098-f043-4da2-83ef-7588a6d426bc"
    description: "PoshC2 is an open source remote administration and post-exploitation framework that is publicly available on GitHub. The server-side components of the tool are primarily written in Python, while the implants are written in PowerShell. Although PoshC2 is primarily focused on Windows implantation, it does contain a basic Python dropper for Linux/macOS.(Citation: GitHub PoshC2)"
