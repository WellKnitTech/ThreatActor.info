name: Fog
aliases:
- FOG
- Fog
description: 'Fog is a sophisticated ransomware strain first observed in April–May
  2024, initially targeting U.S. educational institutions before expanding into sectors
  such as government, business services, finance, and manufacturing. The group conducts
  fast, double-extortion attacks: they exploit compromised VPN credentials or known
  vulnerabilities, deploy encryption (notably using extensions like .fog, .FLOCKED),
  and exfiltrate data prior to encryption to maximize victim pressure. Fog is associated
  with other prolific actors—such as Akira and Conti—through shared tooling, infrastructure
  timelines, and even cryptocurrency wallets.'
