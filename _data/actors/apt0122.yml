description: Silent Librarian is a group that has targeted research and proprietary
  data at universities, government agencies, and private sector companies worldwide
  since at least 2013. Members of Silent Librarian are known to have been affiliated
  with the Iran-based Mabna Institute which has conducted cyber intrusions at the
  behest of the government of Iran, specifically the Islamic Revolutionary Guard Corps
  (IRGC). [DOJ Iran Indictments March 2018](https://www.justice.gov/usao-sdny/press-release/file/1045781/download)
  [Phish Labs Silent Librarian](https://info.phishlabs.com/blog/silent-librarian-more-to-the-story-of-the-iranian-mabna-institute-indictment)
  [Malwarebytes Silent Librarian October 2020](https://blog.malwarebytes.com/malwarebytes-news/2020/10/silent-librarian-apt-phishing-attack/)
