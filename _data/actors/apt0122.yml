- members of university communities worldwide may have been providing access to more
  than just homework assignments.
- the Iranian threat group is likely responsible for a large-scale campaign that targeted
  university credentials using the same spoofing tactics as previous attacks.
- using compromised university resources to send library-themed phishing emails.
- we can tell that Silent Librarian does not limit itself to specific countries but
  tries to get wider coverage.
- we were tipped off by one of our customers about a new active campaign from this
  APT group. Based off a number of intended victims
