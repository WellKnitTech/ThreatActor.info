software:
  - name: "ZxShell"
    mitre_id: "S0412"
    url: "https://attack.mitre.org/software/S0412"
    type: "malware"
    stix_id: "malware--cfc75b0d-e579-40ae-ad07-a1ce00d49a6c"
    description: "ZxShell is a remote administration tool and backdoor that can be downloaded from the Internet, particularly from Chinese hacker websites. It has been used since at least 2004.(Citation: FireEye APT41 Aug 2019)(Citation: Talos ZxShell Oct 2014)"
  - name: "gh0st RAT"
    mitre_id: "S0032"
    url: "https://attack.mitre.org/software/S0032"
    type: "malware"
    stix_id: "malware--88c621a7-aef9-4ae0-94e3-1fc87123eb24"
    description: "gh0st RAT is a remote access tool (RAT). The source code is public and it has been used by multiple groups.(Citation: FireEye Hacking Team)(Citation: Arbor Musical Chairs Feb 2018)(Citation: Nccgroup Gh0st April 2018)"
  - name: "Zox"
    mitre_id: "S0672"
    url: "https://attack.mitre.org/software/S0672"
    type: "malware"
    stix_id: "malware--fb28627c-d6ea-4c35-b138-ab5e96ae5445"
    description: "Zox is a remote access tool that has been used by Axiom since at least 2008.(Citation: Novetta-Axiom)"
  - name: "PlugX"
    mitre_id: "S0013"
    url: "https://attack.mitre.org/software/S0013"
    type: "malware"
    stix_id: "malware--64fa0de0-6240-41f4-8638-f4ca7ed528fd"
    description: "PlugX is a remote access tool (RAT) with modular plugins that has been used by multiple threat groups.(Citation: Lastline PlugX Analysis)(Citation: FireEye Clandestine Fox Part 2)(Citation: New DragonOK)(Citation: Dell TG-3390)"
  - name: "Hikit"
    mitre_id: "S0009"
    url: "https://attack.mitre.org/software/S0009"
    type: "malware"
    stix_id: "malware--95047f03-4811-4300-922e-1ba937d53a61"
    description: "Hikit is malware that has been used by Axiom for late-stage persistence and exfiltration after the initial compromise.(Citation: Novetta-Axiom)(Citation: FireEye Hikit Rootkit)"
  - name: "PoisonIvy"
    mitre_id: "S0012"
    url: "https://attack.mitre.org/software/S0012"
    type: "malware"
    stix_id: "malware--b42378e0-f147-496f-992a-26a49705395b"
    description: "PoisonIvy is a popular remote access tool (RAT) that has been used by many groups.(Citation: FireEye Poison Ivy)(Citation: Symantec Elderwood Sept 2012)(Citation: Symantec Darkmoon Aug 2005)"
  - name: "Derusbi"
    mitre_id: "S0021"
    url: "https://attack.mitre.org/software/S0021"
    type: "malware"
    stix_id: "malware--94379dec-5c87-49db-b36e-66abc0b81344"
    description: "Derusbi is malware used by multiple Chinese APT groups.(Citation: Novetta-Axiom)(Citation: ThreatConnect Anthem) Both Windows and Linux variants have been observed.(Citation: Fidelis Turbo)"
  - name: "Hydraq"
    mitre_id: "S0203"
    url: "https://attack.mitre.org/software/S0203"
    type: "malware"
    stix_id: "malware--73a4793a-ce55-4159-b2a6-208ef29b326f"
    description: "Hydraq is a data-theft trojan first used by Elderwood in the 2009 Google intrusion known as Operation Aurora, though variations of this trojan have been used in more recent campaigns by other Chinese actors, possibly including APT17.(Citation: MicroFocus 9002 Aug 2016)(Citation: Symantec Elderwood Sept 2012)(Citation: Symantec Trojan.Hydraq Jan 2010)(Citation: ASERT Seven Pointed Dagger Aug 2015)(Citation: FireEye DeputyDog 9002 November 2013)(Citation: ProofPoint GoT 9002 Aug 2017)(Citation: Fir"
