operations: ["2015-01","2016","2017","2017-01","All five phishing campaigns targeted a Japanese manufacturing firm over the course of two months","Cybersecurity expert Niklas Femerstrand in an email yesterday pointed out that while servers in several different countries appear to be the origin the attack","In recent months","Japan","This campaign involved five separate phishing attacks","Tibet and Russia","Unit 42 has observed a number of attacks that we attribute to this group. Multiple new variants of the previously discussed sysget malware family have been observed in use by DragonOK. Sysget malware was delivered both directly via phishing emails","adding that there are “strong indications” the campaign is “an operation funded by China”.","also known as HelloBridge. The malware was included as an attachment intended to trick the user into opening the malware.","and political organizations in Cambodia since at least January","as well as in Rich Text Format (RTF) documents exploiting the CVE-2015-1641 vulnerability that in turn leveraged a very unique shellcode.","but the final campaign also targeted a separate Japanese high-tech organization.","each carrying a different variant of Sysget malware","https://unit42.paloaltonetworks.com/unit-42-identifies-new-dragonok-backdoor-malware-deployed-against-japanese-targets/","https://unit42.paloaltonetworks.com/unit42-dragonok-updates-toolset-targets-multiple-geographic-regions/","https://www.phnompenhpost.com/national/kingdom-targeted-new-malware","it has been linked to the DragonOK campaign.","“The DragonOK campaign has previously [in 2014] targeted organizations in Taiwan","” he wrote"]
