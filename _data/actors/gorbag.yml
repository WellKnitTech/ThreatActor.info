name: "Gorbag"
aliases: ["Gorbag"]
description: "Gorbag is a Russia-aligned threat actor active since at least February 2025 that targets Ukrainian organizations, including law enforcement, justice entities, frontline administrations, defense organizations, and a transportation hub for foreign military aid. It collects credentials, VPN configurations, documents, and .zs2 electronic signature keys in a single pass, including from mapped drives and removable media, before deleting its malware. ESET assesses that Gorbag may act as an initial access broker, passing stolen credentials to other Russia-aligned actors."
