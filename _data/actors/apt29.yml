  campaign_id: C0024
  url: https://attack.mitre.org/campaigns/C0024
  stix_id: campaign--808d6b30-df4e-4341-8248-724da4bac650
  description: The SolarWinds Compromise was a sophisticated supply chain cyber operation
    conducted by APT29 that was discovered in mid-December 2020. APT29 used customized
    malware to inject malicious code into the SolarWinds Orion software build process
    that was later distributed through a normal software update; they also used password
    spraying, token theft, API abuse, spear phishing, and other supply chain attacks
    to compromise user accounts and leverage their associated access. Victims of this
    campaign incl
- name: Operation Ghost
  campaign_id: C0023
  url: https://attack.mitre.org/campaigns/C0023
  stix_id: campaign--7854c1a0-f06c-4876-98a4-4bbd34751b05
  description: 'Operation Ghost was an APT29 campaign starting in 2013 that included
    operations against ministries of foreign affairs in Europe and the Washington,
    D.C. embassy of a European Union country. During Operation Ghost, APT29 used new
    families of malware and leveraged web services, steganography, and unique C2 infrastructure
    for each victim.(Citation: ESET Dukes October 2019)

    '
