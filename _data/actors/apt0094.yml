software:
  - name: "Troll Stealer"
    mitre_id: "S1196"
    url: "https://attack.mitre.org/software/S1196"
    type: "malware"
    stix_id: "malware--d6748457-75c2-4989-a41f-2d017994057e"
    description: "Troll Stealer is an information stealer written in Go associated with Kimsuky operations. Troll Stealer has typically been delivered through a dropper disguised as a legitimate security program installation file. Troll Stealer features code similar to AppleSeed, also uniquely associated with Kimsuky operations.(Citation: S2W Troll Stealer 2024)(Citation: Symantec Troll Stealer 2024)"
  - name: "HTTPTroy"
    mitre_id: "S9007"
    url: "https://attack.mitre.org/software/S9007"
    type: "malware"
    stix_id: "malware--52b52f72-88e6-4847-88d6-da3b9e4a4f71"
    description: "HTTPTroy is a highly obfuscated backdoor that facilitates collection, command and control, defense evasion and exfiltration.  HTTPTroy was first reported in October 2025. HTTPTroy has been observed in operations attributed to DPRK-affiliated threat actors, including Kimsuky.  HTTPTroy has been delivered to victims through a separate loader leveraged by Kimsuky.(Citation: Gen Digital Kimsuky HTTPTroy October 2025)"
  - name: "schtasks"
    mitre_id: "S0111"
    url: "https://attack.mitre.org/software/S0111"
    type: "tool"
    stix_id: "tool--c9703cd3-141c-43a0-a926-380082be5d04"
    description: "schtasks is used to schedule execution of programs or scripts on a Windows system to run at a specific date and time. (Citation: TechNet Schtasks)"
  - name: "certutil"
    mitre_id: "S0160"
    url: "https://attack.mitre.org/software/S0160"
    type: "tool"
    stix_id: "tool--0a68f1f1-da74-4d28-8d9a-696c082706cc"
    description: "certutil is a command-line utility that can be used to obtain certificate authority information and configure Certificate Services. (Citation: TechNet Certutil)"
  - name: "Amadey"
    mitre_id: "S1025"
    url: "https://attack.mitre.org/software/S1025"
    type: "malware"
    stix_id: "malware--05318127-5962-444b-b900-a9dcfe0ff6e9"
    description: "Amadey is a Trojan bot that has been used since at least October 2018.(Citation: Korean FSI TA505 2020)(Citation: BlackBerry Amadey 2020)"
  - name: "GoBear"
    mitre_id: "S1197"
    url: "https://attack.mitre.org/software/S1197"
    type: "malware"
    stix_id: "malware--98943603-5be6-4551-8c98-bbaf0d229d39"
    description: "GoBear is a Go-based backdoor that abuses legitimate, stolen certificates for defense evasion purposes. GoBear is exclusively linked to Kimsuky operations.(Citation: S2W Troll Stealer 2024)(Citation: Symantec Troll Stealer 2024)"
  - name: "Brave Prince"
    mitre_id: "S0252"
    url: "https://attack.mitre.org/software/S0252"
    type: "malware"
    stix_id: "malware--28b97733-ef07-4414-aaa5-df50b2d30cc5"
    description: "Brave Prince is a Korean-language implant that was first observed in the wild in December 2017. It contains similar code and behavior to Gold Dragon, and was seen along with Gold Dragon and RunningRAT in operations surrounding the 2018 Pyeongchang Winter Olympics. (Citation: McAfee Gold Dragon)"
  - name: "CSPY Downloader"
    mitre_id: "S0527"
    url: "https://attack.mitre.org/software/S0527"
    type: "tool"
    stix_id: "tool--5256c0f8-9108-4c92-8b09-482dfacdcd94"
    description: "CSPY Downloader is a tool designed to evade analysis and download additional payloads used by Kimsuky.(Citation: Cybereason Kimsuky November 2020)"
  - name: "gh0st RAT"
    mitre_id: "S0032"
    url: "https://attack.mitre.org/software/S0032"
    type: "malware"
    stix_id: "malware--88c621a7-aef9-4ae0-94e3-1fc87123eb24"
    description: "gh0st RAT is a remote access tool (RAT). The source code is public and it has been used by multiple groups.(Citation: FireEye Hacking Team)(Citation: Arbor Musical Chairs Feb 2018)(Citation: Nccgroup Gh0st April 2018)"
  - name: "AppleSeed"
    mitre_id: "S0622"
    url: "https://attack.mitre.org/software/S0622"
    type: "malware"
    stix_id: "malware--295721d2-ee20-4fa3-ade3-37f4146b4570"
    description: "AppleSeed is a backdoor that has been used by Kimsuky to target South Korean government, academic, and commercial  targets since at least 2021.(Citation: Malwarebytes Kimsuky June 2021)"
  - name: "Gomir"
    mitre_id: "S1198"
    url: "https://attack.mitre.org/software/S1198"
    type: "malware"
    stix_id: "malware--3128c86d-bd0d-445c-850f-96abf68fbfc3"
    description: "Gomir is a Linux backdoor variant of the Go-based malware GoBear, uniquely assoicated with Kimsuky operations.(Citation: Symantec Troll Stealer 2024)"
  - name: "NOKKI"
    mitre_id: "S0353"
    url: "https://attack.mitre.org/software/S0353"
    type: "malware"
    stix_id: "malware--071d5d65-83ec-4a55-acfa-be7d5f28ba9a"
    description: "NOKKI is a modular remote access tool. The earliest observed attack using NOKKI was in January 2018. NOKKI has significant code overlap with the KONNI malware family. There is some evidence potentially linking NOKKI to APT37.(Citation: Unit 42 NOKKI Sept 2018)(Citation: Unit 42 Nokki Oct 2018)"
  - name: "QuasarRAT"
    mitre_id: "S0262"
    url: "https://attack.mitre.org/software/S0262"
    type: "tool"
    stix_id: "tool--da04ac30-27da-4959-a67d-450ce47d9470"
    description: "QuasarRAT is an open-source, remote access tool that has been publicly available on GitHub since at least 2014. QuasarRAT is developed in the C# language.(Citation: GitHub QuasarRAT)(Citation: Volexity Patchwork June 2018)"
  - name: "Gold Dragon"
    mitre_id: "S0249"
    url: "https://attack.mitre.org/software/S0249"
    type: "malware"
    stix_id: "malware--b9799466-9dd7-4098-b2d6-f999ce50b9a8"
    description: "Gold Dragon is a Korean-language, data gathering implant that was first observed in the wild in South Korea in July 2017. Gold Dragon was used along with Brave Prince and RunningRAT in operations targeting organizations associated with the 2018 Pyeongchang Winter Olympics. (Citation: McAfee Gold Dragon)"
  - name: "PsExec"
    mitre_id: "S0029"
    url: "https://attack.mitre.org/software/S0029"
    type: "tool"
    stix_id: "tool--ff6caf67-ea1f-4895-b80e-4bb0fc31c6db"
    description: "PsExec is a free Microsoft tool that can be used to execute a program on another computer. It is used by IT administrators and attackers.(Citation: Russinovich Sysinternals)(Citation: SANS PsExec)"
  - name: "KGH_SPY"
    mitre_id: "S0526"
    url: "https://attack.mitre.org/software/S0526"
    type: "malware"
    stix_id: "malware--8bdfe255-e658-4ddd-a11c-b854762e451d"
    description: "KGH_SPY is a modular suite of tools used by Kimsuky for reconnaissance, information stealing, and backdoor capabilities. KGH_SPY derived its name from PDB paths and internal names found in samples containing \"KGH\".(Citation: Cybereason Kimsuky November 2020)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "BabyShark"
    mitre_id: "S0414"
    url: "https://attack.mitre.org/software/S0414"
    type: "malware"
    stix_id: "malware--d1b7830a-fced-4be3-a99c-f495af9d9e1b"
    description: "BabyShark is a Microsoft Visual Basic (VB) script-based malware family that is believed to be associated with several North Korean campaigns. (Citation: Unit42 BabyShark Feb 2019)"
  - name: "TRANSLATEXT"
    mitre_id: "S1201"
    url: "https://attack.mitre.org/software/S1201"
    type: "malware"
    stix_id: "malware--4b72b6a7-72be-45d9-af02-fdcf0fc6d358"
    description: "TRANSLATEXT is malware that is believed to be used by Kimsuky.(Citation: Zscaler Kimsuky TRANSLATEXT) TRANSLATEXT masqueraded as a Google Translate extension for Google Chrome, but is actually a collection of four malicious Javascript files that perform defense evasion, information collection and exfiltration.(Citation: Zscaler Kimsuky TRANSLATEXT) "
