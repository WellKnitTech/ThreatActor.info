operations: ["2017","2017-02","2017-03","2017-04","2017-06","2017-07","2017-10","2018","2018-05","2018-11","2018/2019","2019-01","2019-10","2020-03","2020-07","2020-12","2021-06","2021-10","2022-01","2023 Late","2023-03","2024-04","2024-07","A US hospitality provider has recently been the target of an incredibly rare BadUSB attack","A unique aspect of the incidents was how the group installed the CARBANAK backdoor for persistent access. Mandiant identified that the group leveraged an application shim database to achieve persistence on systems in multiple environments. The shim injected a malicious in-memory patch into the Services Control Manager (“services.exe”) process","All of the observed intended recipients of the spear phishing campaign appeared to be involved with SEC filings for their respective organizations.","Arby’s","Attack to target banks and the enterprise","Burgerville","Chili’s","Chipotle: A mysterious group known as Fin7.","Collaboration between FIN7 and the RYUK group","Cybercrime Group FIN7 Using Windows 11 Alpha-Themed Docs to Drop Javascript Backdoor","FIN7 Deploys Anubis Backdoor to Hijack Windows Systems via Compromised SharePoint Sites","FIN7 Power Hour: Adversary Archaeology and the Evolution of FIN7","FIN7 Recruits Talent For Push Into Ransomware","FIN7 Uses Trusted Brands and Sponsored Google Ads to Distribute MSIX Payloads","FIN7 again unleashed a new attack able to bypass almost every security solution. The attack","FIN7 hosting honeypot domains with malicious AI DeepNude Generators – New Silent Push research","FIN7 modified their phishing techniques to implement unique infection and persistence mechanisms. FIN7 has moved away from weaponized Microsoft Office macros in order to evade detection. This round of FIN7 phishing lures implements hidden shortcut files (LNK files) to initiate the infection and VBScript functionality launched by mshta.exe to infect the victim.","FIN7 tradecraft seen in attacks against Veeam backup servers","FIN7: The Truth Doesn't Need to be so STARK","Fifth Avenue","FireEye as a Service (FaaS) identified a spear phishing campaign that appeared to be targeting personnel involved with United States Securities and Exchange Commission (SEC) filings at various organizations.","Flashpoint analysts recently uncovered a new attack panel used by this group in campaigns they have called Astra. The panel","High-profile breaches including Red Robin","Highly sophisticated fileless attack targeting restaurants across the US","In 2018-2019","In a newly-identified campaign","In late February 2017","In this blog","In this blog post","Jason’s Deli","Leveraging Shim Databases for Persistence","Like clockwork","Morphisec Lab identified a new","New Attack Panel and Malware Samples","Odinaff","Omni Hotels and Saks Fifth Avenue","On June 7","Proofpoint researchers have uncovered that the threat actor commonly referred to as FIN7 has added a new Jscript backdoor called Bateleur and updated macros to its toolkit.","Saks Off 5th","Since the loader is specifically built for each targeted machine and requires administrative permissions to deploy","The attack happened after the company received an envelope containing a fake BestBuy gift card","The campaigns","The shared codebase with recent tools attributed to FIN7","This report presents an attack chain that was intercepted and prevented within a customer’s network in December 2020","Threat Group FIN7 Targets the U.S. Automotive Industry","Trump Hotels","Two recent fileless malware campaigns targeting financial institutions","Whole Foods","ZDNet has learned from cyber-security firm Trustwave.","allows to attribute this new loader to the cybercrime group. The timestamps","along with a USB thumb drive.","among many others.","and Lord & Taylor department stores—all owned by The Hudson’s Bay Company—acknowledged a data breach impacting more than five million credit and debit card numbers. The culprits? The same group that’s spent the last few years pulling off data heists from Omni Hotels & Resorts","and then spawned a CARBANAK backdoor process.","disclosed by Kaspersky Lab and Cisco’s Talos research outfit in the last five weeks","during the investigation","functions as a script-management system","government agencies and other enterprises have been linked to the same attack group.","highly sophisticated fileless attack targeting restaurants across the US. The ongoing campaign allows hackers to seize system control and install a backdoor to steal financial information at will. It incorporates some never before seen evasive techniques that allow it to bypass most security solutions – signature and behavior based.","http://blog.morphisec.com/fin7-attack-modifications-revealed","http://blog.morphisec.com/fin7-attacks-restaurant-industry","http://blog.morphisec.com/fin7-not-finished-morphisec-spots-new-campaign","https://blog.morphisec.com/the-evolution-of-the-fin7-jssloader","https://blog.truesec.com/2020/12/22/collaboration-between-fin7-and-the-ryuk-group-a-truesec-investigation/","https://blogs.blackberry.com/en/2024/04/fin7-targets-the-united-states-automotive-industry","https://geminiadvisory.io/fin7-ransomware-bastion-secure/","https://labs.withsecure.com/publications/fin7-target-veeam-servers","https://securelist.com/fin7-5-the-infamous-cybercrime-rig-fin7-continues-its-activities/90703/","https://thehackernews.com/2025/04/fin7-deploys-anubis-backdoor-to-hijack.html","https://threatpost.com/fileless-malware-campaigns-tied-to-same-attacker/124369/","https://www.anomali.com/blog/cybercrime-group-fin7-using-windows-11-alpha-themed-docs-to-drop-javascript-backdoor","https://www.esentire.com/blog/fin7-uses-trusted-brands-and-sponsored-google-ads-to-distribute-msix-payloads","https://www.fireeye.com/blog/threat-research/2017/03/fin7_spear_phishing.html","https://www.fireeye.com/blog/threat-research/2017/04/fin7-phishing-lnk.html","https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html","https://www.fireeye.com/blog/threat-research/2019/10/mahalo-fin7-responding-to-new-tools-and-techniques.html","https://www.flashpoint-intel.com/blog/fin7-revisited-inside-astra-panel-and-sqlrat-malware/","https://www.fortinet.com/blog/threat-research/bioload-fin7-boostwrite-lost-twin.html","https://www.mandiant.com/resources/evolution-of-fin7","https://www.proofpoint.com/us/threat-insight/post/fin7carbanak-threat-actor-unleashes-bateleur-jscript-backdoor","https://www.silentpush.com/blog/fin7-malware-deepfake-ai-honeypot/","https://www.team-cymru.com/post/fin7-the-truth-doesn-t-need-to-be-so-stark","https://www.zdnet.com/article/rare-badusb-attack-detected-in-the-wild-against-us-hospitality-provider/","is yet another demonstration of the high-paced innovation by threat actors.","it suggests the group gathers information about its targets’ networks.","leading the researchers to believe that this threat actor had remained active despite the 2018 arrests. In addition","made extensive use of fileless malware and known penetration testing tools and utilities to spy on organizations and move data and money off of networks.","pushing attack scripts down to compromised computers.","researchers of Kaspersky Lab’s Global Research and Analysis Team analyzed various campaigns that used the same Tactics Tools and Procedures (TTPs) as the historic FIN7","suggest BIOLOAD is a preceding iteration of BOOSTWRITE.","then will focus on a component from a typical FIN7 attack chain - JSSLoader.","together with simpler functionality","together with the same techniques and backdoor","we discovered certain similarities to other attacker groups that seemed to share or copy the FIN7 TTPs in their own operations.","we present our findings on two campaigns","we reveal two of FIN7’s new tools that we have called BOOSTWRITE and RDFSNIFFER.","which occurred in the first and second weeks of November. These campaigns follow patterns similar to those presented by FireEye in August but with just enough variations to bypass many security vendors.","which took place between October 8 to 10","written in PHP"]
