name: "Salt Typhoon"
aliases: ["FamousSparrow","GhostEmperor","OPERATOR PANDA","RedMike","Salt Typhoon","UNC2286"]
description: "Salt Typhoon is a People's Republic of China (PRC) state-backed actor that has been active since at least 2019 and responsible for numerous compromises of network infrastructure at major U.S. telecommunication and internet service providers (ISP). Salt Typhoon has targeted and leveraged public facing network edge devices to gain access to victim environments. Salt Typhoon has been publicly associated with activities resembling other security industry reported activity groups to include OPERATOR PANDA, RedMike, GhostEmperor, and UNC5807. [US Dept. of Treasury Salt Typhoon JAN 2025](https://home.treasury.gov/news/press-releases/jy2792) [Cisco Salt Typhoon FEB 2025](https://blog.talosintelligence.com/salt-typhoon-analysis/) [CISA_AA25-239ASaltTyphoon_Sept2025](https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a) [CarySentinelLabs_CiscoSaltTyphoon_Dec2025](https://www.sentinelone.com/labs/malicious-apprentice-how-two-hackers-went-from-cisco-academy-to-cisco-cves/) [CrowdStrike_OperatorPanda_NoDate](https://www.crowdstrike.com/en-us/adversaries/operator-panda/) [RF_SaltTyphoon_Feb2025](https://www.recordedfuture.com/research/redmike-salt-typhoon-exploits-vulnerable-devices) [Microsoft_ThreatActorNaming_NoDate](https://learn.microsoft.com/en-us/unified-secops/microsoft-threat-actor-naming) [Mandiant_M-Trends2026_Mar2026](https://cloud.google.com/blog/topics/threat-intelligence/m-trends-2026) "
