campaigns:
  - name: "3CX Supply Chain Attack"
    campaign_id: "C0057"
    url: "https://attack.mitre.org/campaigns/C0057"
    stix_id: "campaign--4fd53ccc-c6b1-4e3c-abe8-a456d46d789e"
    description: "The 3CX Supply Chain Attack was the first publicly reported case of one supply chain compromise triggering another, leading to a cascading, two-stage intrusion. The initial supply chain attack began when a 3CX employee downloaded and executed a trojanized, end-of-life version of the X_Trader trading software from Trading Technologies. This provided UNC4736, a threat cluster associated with AppleJeus, access to the 3CX environment. From there UNC4736 compromised the Windows and macOS build environ"
