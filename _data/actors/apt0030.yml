  - name: "AdFind"
    mitre_id: "S0552"
    url: "https://attack.mitre.org/software/S0552"
    type: "tool"
    stix_id: "tool--f59508a6-3615-47c3-b493-6676e1a39a87"
    description: "AdFind is a free command-line query tool that can be used for gathering information from Active Directory.(Citation: Red Canary Hospital Thwarted Ryuk October 2020)(Citation: FireEye FIN6 Apr 2019)(Citation: FireEye Ryuk and Trickbot January 2019)"
  - name: "Ping"
    mitre_id: "S0097"
    url: "https://attack.mitre.org/software/S0097"
    type: "tool"
    stix_id: "tool--b77b563c-34bb-4fb8-86a3-3694338f7b47"
    description: "Ping is an operating system utility commonly used to troubleshoot and verify network connections. (Citation: TechNet Ping)"
  - name: "Impacket"
    mitre_id: "S0357"
    url: "https://attack.mitre.org/software/S0357"
    type: "tool"
    stix_id: "tool--26c87906-d750-42c5-946c-d4162c73fc7b"
    description: "Impacket is an open source collection of modules written in Python for programmatically constructing and manipulating network protocols. Impacket contains several tools for remote service execution, Kerberos manipulation, Windows credential dumping, packet sniffing, and relay attacks.(Citation: Impacket Tools)"
  - name: "Emissary"
    mitre_id: "S0082"
    url: "https://attack.mitre.org/software/S0082"
    type: "malware"
    stix_id: "malware--0f862b01-99da-47cc-9bdb-db4a86a95bb1"
    description: "Emissary is a Trojan that has been used by Lotus Blossom. It shares code with Elise, with both Trojans being part of a malware group referred to as LStudio.(Citation: Lotus Blossom Dec 2015)"
  - name: "Elise"
    mitre_id: "S0081"
    url: "https://attack.mitre.org/software/S0081"
    type: "malware"
    stix_id: "malware--7551188b-8f91-4d34-8350-0d0c57b2b913"
    description: "Elise is a custom backdoor Trojan that appears to be used exclusively by Lotus Blossom. It is part of a larger group of tools referred to as LStudio, ST Group, and APT0LSTU.(Citation: Lotus Blossom Jun 2015)(Citation: Accenture Dragonfish Jan 2018)"
  - name: "Hannotog"
    mitre_id: "S1211"
    url: "https://attack.mitre.org/software/S1211"
    type: "malware"
    stix_id: "malware--273e2b53-64ec-48be-9ad9-8f3dc0e53718"
    description: "Hannotog is a type of backdoor malware uniquely assoicated with Lotus Blossom operations since at least 2022.(Citation: Symantec Bilbug 2022)"
  - name: "NBTscan"
    mitre_id: "S0590"
    url: "https://attack.mitre.org/software/S0590"
    type: "tool"
    stix_id: "tool--b63970b7-ddfb-4aee-97b1-80d335e033a8"
    description: "NBTscan is an open source tool that has been used by state groups to conduct internal reconnaissance within a compromised network.(Citation: Debian nbtscan Nov 2019)(Citation: SecTools nbtscan June 2003)(Citation: Symantec Waterbug Jun 2019)(Citation: FireEye APT39 Jan 2019)"
  - name: "Sagerunex"
    mitre_id: "S1210"
    url: "https://attack.mitre.org/software/S1210"
    type: "malware"
    stix_id: "malware--7f269253-c225-45ff-87c2-5e8ef6dd369f"
    description: "Sagerunex is a malware family exclusively associated with Lotus Blossom operations, with variants existing since at least 2016. Variations of Sagerunex leverage non-traditional command and control mechanisms such as various web services.(Citation: Symantec Bilbug 2022)(Citation: Cisco LotusBlossom 2025)"
  - name: "certutil"
    mitre_id: "S0160"
    url: "https://attack.mitre.org/software/S0160"
    type: "tool"
    stix_id: "tool--0a68f1f1-da74-4d28-8d9a-696c082706cc"
    description: "certutil is a command-line utility that can be used to obtain certificate authority information and configure Certificate Services. (Citation: TechNet Certutil)"
