name: "Atesh"
aliases: ["Atesh"]
description: "Atesh is a pro-Ukrainian hacking group that claimed to have hacked an app and compromised regional ministry channels on the MAX messenger. It posted a screenshot of a fake alert on Telegram. Russian media and regional authorities confirmed that the ministry’s services were hacked, but Atesh’s involvement has not been independently confirmed."
