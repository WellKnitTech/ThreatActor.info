name: "SlippyNunchucks"
aliases: ["SlippyNunchucks"]
description: "SlippyNunchucks is a China-aligned APT group active since at least September 15, 2023, targeting organizations and Chinese-speaking individuals primarily in South and East Asia, with some victims in Europe. Its cyberespionage operations center on DarkVigil, a modular .NET implant with more than 20 known plugins. The group abuses Chinese applications to deploy DarkVigil, including by hijacking DNS resolution and injecting malicious configuration into Sogou Input Method’s insecure HTTP communications. ESET tracks SlippyNunchucks independently of Mustang Panda, with no known associations between the groups."
