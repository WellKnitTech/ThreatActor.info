description: Good Day is a ransomware variant within the ARCrypter family, first observed
  in May 2023. It gained prominence due to its reticent financial extortion model
  and custom branding—victims are greeted with a “Good day” message upon landing on
  individualized Tor-based victim portals. The malware is typically delivered via
  phishing campaigns disguising payloads as legitimate Windows updates. It utilizes
  a robust encryption workflow, including deletion of volume shadow copies and process
  evasion mechanisms. Notably, Good Day has been linked to the Cloak ransomware group
  through shared data leak infrastructure and overlapping leak portal behaviors.
