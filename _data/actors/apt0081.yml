software:
  - name: "USBferry"
    mitre_id: "S0452"
    url: "https://attack.mitre.org/software/S0452"
    type: "malware"
    stix_id: "malware--75bba379-4ba1-467e-8c60-ec2b269ee984"
    description: "USBferry is an information stealing malware and has been used by Tropic Trooper in targeted attacks against Taiwanese and Philippine air-gapped military environments. USBferry shares an overlapping codebase with YAHOYAH, though it has several features which makes it a distinct piece of malware.(Citation: TrendMicro Tropic Trooper May 2020)"
  - name: "ShadowPad"
    mitre_id: "S0596"
    url: "https://attack.mitre.org/software/S0596"
    type: "malware"
    stix_id: "malware--ec9e00dd-0313-4d5b-8105-c20aa47abffc"
    description: "ShadowPad is a modular backdoor that was first identified in a supply chain compromise of the NetSarang software in mid-July 2017. The malware was originally thought to be exclusively used by APT41, but has since been observed to be used by various Chinese threat activity groups. (Citation: Recorded Future RedEcho Feb 2021)(Citation: Securelist ShadowPad Aug 2017)(Citation: Kaspersky ShadowPad Aug 2017) "
  - name: "PoisonIvy"
    mitre_id: "S0012"
    url: "https://attack.mitre.org/software/S0012"
    type: "malware"
    stix_id: "malware--b42378e0-f147-496f-992a-26a49705395b"
    description: "PoisonIvy is a popular remote access tool (RAT) that has been used by many groups.(Citation: FireEye Poison Ivy)(Citation: Symantec Elderwood Sept 2012)(Citation: Symantec Darkmoon Aug 2005)"
  - name: "BITSAdmin"
    mitre_id: "S0190"
    url: "https://attack.mitre.org/software/S0190"
    type: "tool"
    stix_id: "tool--64764dc6-a032-495f-8250-1e4c06bdc163"
    description: "BITSAdmin is a command line tool used to create and manage BITS Jobs. (Citation: Microsoft BITSAdmin)"
  - name: "YAHOYAH"
    mitre_id: "S0388"
    url: "https://attack.mitre.org/software/S0388"
    type: "malware"
    stix_id: "malware--cb444a16-3ea5-4a91-88c6-f329adcb8af3"
    description: "YAHOYAH is a Trojan used by Tropic Trooper as a second-stage backdoor.(Citation: TrendMicro TropicTrooper 2015)"
  - name: "KeyBoy"
    mitre_id: "S0387"
    url: "https://attack.mitre.org/software/S0387"
    type: "malware"
    stix_id: "malware--5dd649c0-bca4-488b-bd85-b180474ec62e"
    description: "KeyBoy is malware that has been used in targeted campaigns against members of the Tibetan Parliament in 2016.(Citation: CitizenLab KeyBoy Nov 2016)(Citation: PWC KeyBoys Feb 2017)"
