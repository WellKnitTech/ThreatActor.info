    type: "malware"
    stix_id: "malware--308b3d68-a084-4dfb-885a-3125e1a9c1e8"
    description: "GreyEnergy is a backdoor written in C and compiled in Visual Studio. GreyEnergy shares similarities with the BlackEnergy malware and is thought to be the successor of it.(Citation: ESET GreyEnergy Oct 2018)"
  - name: "PsExec"
    mitre_id: "S0029"
    url: "https://attack.mitre.org/software/S0029"
    type: "tool"
    stix_id: "tool--ff6caf67-ea1f-4895-b80e-4bb0fc31c6db"
    description: "PsExec is a free Microsoft tool that can be used to execute a program on another computer. It is used by IT administrators and attackers.(Citation: Russinovich Sysinternals)(Citation: SANS PsExec)"
  - name: "Prestige"
    mitre_id: "S1058"
    url: "https://attack.mitre.org/software/S1058"
    type: "malware"
    stix_id: "malware--1da748a5-875d-4212-9222-b4c23ab861be"
    description: "Prestige ransomware has been used by Sandworm Team since at least March 2022, including against transportation and related logistics industries in Ukraine and Poland in October 2022.(Citation: Microsoft Prestige ransomware October 2022)"
  - name: "P.A.S. Webshell"
    mitre_id: "S0598"
    url: "https://attack.mitre.org/software/S0598"
    type: "malware"
    stix_id: "malware--4800d0f9-00aa-47cd-a4d2-92198585b8fd"
    description: "P.A.S. Webshell is a publicly available multifunctional PHP webshell in use since at least 2016 that provides remote access and execution on target web servers.(Citation: ANSSI Sandworm January 2021)"
  - name: "AcidPour"
    mitre_id: "S1167"
    url: "https://attack.mitre.org/software/S1167"
    type: "malware"
    stix_id: "malware--4b1b3a36-bbd6-462c-9c03-7fd4fb5e0dfa"
    description: "AcidPour is a variant of AcidRain designed to impact a wider range of x86 architecture Linux devices. AcidPour is an x86 ELF binary that expands on the targeted devices and locations in AcidRain by including items such as Unsorted Block Image (UBI), Deice Mapper (DM), and various flash memory references. Based on this expanded targeting, AcidPour can impact a variety of device types including IoT, networking, and ICS embedded device types.(Citation: SentinelOne AcidPour 2024) AcidPour is a wiping"
  - name: "VPNFilter"
    mitre_id: "S1010"
    url: "https://attack.mitre.org/software/S1010"
    type: "malware"
    stix_id: "malware--6108f800-10b8-4090-944e-be579f01263d"
    description: "VPNFilter is a multi-stage, modular platform with versatile capabilities to support both intelligence-collection and destructive cyber attack operations. VPNFilter modules such as its packet sniffer ('ps') can collect traffic that passes through an infected device, allowing the theft of website credentials and monitoring of Modbus SCADA protocols. (Citation: William Largent June 2018) (Citation: Carl Hurd March 2019) VPNFilter was assessed to be replaced by Sandworm Team with Cyclops Blink starti"
  - name: "Neo-reGeorg"
    mitre_id: "S1189"
    url: "https://attack.mitre.org/software/S1189"
    type: "malware"
    stix_id: "malware--bae6edd1-eb36-4581-ba7e-6cbfe0e24eac"
    description: "Neo-reGeorg is an open-source web shell designed as a restructuring of reGeorg with improved usability, security, and fixes for exising reGeorg bugs.(Citation: GitHub Neo-reGeorg 2019)"
  - name: "Cyclops Blink"
    mitre_id: "S0687"
    url: "https://attack.mitre.org/software/S0687"
    type: "malware"
    stix_id: "malware--b350b47f-88fe-4921-8538-6d9c59bac84e"
    description: "Cyclops Blink is a modular malware that has been used in widespread campaigns by Sandworm Team since at least 2019 to target Small/Home Office (SOHO) network devices, including WatchGuard and Asus. Cyclops Blink is assessed to be a replacement for VPNFilter, a similar platform targeting network devices.(Citation: NCSC Cyclops Blink February 2022)(Citation: NCSC CISA Cyclops Blink Advisory February 2022)(Citation: Trend Micro Cyclops Blink March 2022)"
  - name: "SDelete"
    mitre_id: "S0195"
    url: "https://attack.mitre.org/software/S0195"
    type: "tool"
    stix_id: "tool--d8d19e33-94fd-4aa3-b94a-08ee801a2153"
    description: "SDelete is an application that securely deletes data in a way that makes it unrecoverable. It is part of the Microsoft Sysinternals suite of tools. (Citation: Microsoft SDelete July 2016)"
  - name: "Empire"
    mitre_id: "S0363"
    url: "https://attack.mitre.org/software/S0363"
    type: "tool"
    stix_id: "tool--3433a9e8-1c47-4320-b9bf-ed449061d1c3"
    description: "Empire is an open-source, cross-platform remote administration and post-exploitation framework that is publicly available on GitHub. While the tool itself is primarily written in Python, the post-exploitation agents are written in pure PowerShell for Windows and Python for Linux/macOS. Empire was one of five tools singled out by a joint report on public hacking tools being widely used by adversaries.(Citation: NCSC Joint Report Public Tools)(Citation: Github PowerShell Empire)(Citation: GitHub AT"
  - name: "Kapeka"
    mitre_id: "S1190"
    url: "https://attack.mitre.org/software/S1190"
    type: "malware"
    stix_id: "malware--a43e55c9-0b7c-42c0-81de-b7a42d724db9"
    description: "Kapeka is a backdoor written in C++ used against victims in Eastern Europe since at least mid-2022. Kapeka has technical overlaps with Exaramel for Windows and Prestige malware variants, both of which are linked to Sandworm Team. Kapeka may have been used in advance of Prestige deployment in late 2022.(Citation: WithSecure Kapeka 2024)(Citation: Microsoft KnuckleTouch 2024)"
  - name: "AcidRain"
    mitre_id: "S1125"
    url: "https://attack.mitre.org/software/S1125"
    type: "malware"
    stix_id: "malware--04cecafd-cb5f-4daf-aa1f-73899116c4a2"
    description: "AcidRain is an ELF binary targeting modems and routers using MIPS architecture.(Citation: AcidRain JAGS 2022) AcidRain is associated with the ViaSat KA-SAT communication outage that took place during the initial phases of the 2022 full-scale invasion of Ukraine. Analysis indicates overlap with another network device-targeting malware, VPNFilter, associated with Sandworm Team.(Citation: AcidRain JAGS 2022) US and European government sources linked AcidRain to Russian government entities, while Ukr"
  - name: "Industroyer"
    mitre_id: "S0604"
    url: "https://attack.mitre.org/software/S0604"
    type: "malware"
    stix_id: "malware--e401d4fe-f0c9-44f0-98e6-f93487678808"
    description: "Industroyer is a sophisticated malware framework designed to cause an impact to the working processes of Industrial Control Systems (ICS), specifically components used in electrical substations.(Citation: ESET Industroyer) Industroyer was used in the attacks on the Ukrainian power grid in December 2016.(Citation: Dragos Crashoverride 2017) This is the first publicly known malware specifically designed to target and impact operations in the electric grid.(Citation: Dragos Crashoverride 2018)"
  - name: "Industroyer2"
    mitre_id: "S1072"
    url: "https://attack.mitre.org/software/S1072"
    type: "malware"
    stix_id: "malware--6a0d0ea9-b2c4-43fe-a552-ac41a3009dc5"
    description: "Industroyer2 is a compiled and static piece of malware that has the ability to communicate over the IEC-104 protocol. It is similar to the IEC-104 module found in Industroyer. Security researchers assess that Industroyer2 was designed to cause impact to high-voltage electrical substations. The initial Industroyer2 sample was compiled on 03/23/2022 and scheduled to execute on 04/08/2022, however it was discovered before deploying, resulting in no impact.(Citation: Industroyer2 Blackhat ESET)"
  - name: "BlackEnergy"
    mitre_id: "S0089"
    url: "https://attack.mitre.org/software/S0089"
    type: "malware"
    stix_id: "malware--54cc1d4f-5c53-4f0e-9ef5-11b4998e82e4"
    description: "BlackEnergy is a malware toolkit that has been used by both criminal and APT actors. It dates back to at least 2007 and was originally designed to create botnets for use in conducting Distributed Denial of Service (DDoS) attacks, but its use has evolved to support various plug-ins. It is well known for being used during the confrontation between Georgia and Russia in 2008, as well as in targeting Ukrainian institutions. Variants include BlackEnergy 2 and BlackEnergy 3. (Citation: F-Secure BlackEn"
  - name: "Cobalt Strike"
    mitre_id: "S0154"
    url: "https://attack.mitre.org/software/S0154"
    type: "malware"
    stix_id: "malware--a7881f21-e978-4fe4-af56-92c9416a2616"
    description: "Cobalt Strike is a commercial, full-featured, remote access tool that bills itself as “adversary simulation software designed to execute targeted attacks and emulate the post-exploitation actions of advanced threat actors”. Cobalt Strike’s interactive post-exploit capabilities cover the full range of ATT&CK tactics, all executed within a single, integrated system.(Citation: cobaltstrike manual)\n\nIn addition to its own capabilities, Cobalt Strike leverages the capabilities of other well-known tool"
  - name: "NotPetya"
    mitre_id: "S0368"
    url: "https://attack.mitre.org/software/S0368"
    type: "malware"
    stix_id: "malware--5719af9d-6b16-46f9-9b28-fb019541ddbb"
    description: "NotPetya is malware that was used by Sandworm Team in a worldwide attack starting on June 27, 2017. While NotPetya appears as a form of ransomware, its main purpose was to destroy data and disk structures on compromised systems; the attackers never intended to make the encrypted data recoverable. As such, NotPetya may be more appropriately thought of as a form of wiper malware. NotPetya contains worm-like features to spread itself across a computer network using the SMBv1 exploits EternalBlue and"
  - name: "KillDisk"
    mitre_id: "S0607"
    url: "https://attack.mitre.org/software/S0607"
    type: "malware"
    stix_id: "malware--e221eb77-1502-4129-af1d-fe1ad55e7ec6"
    description: "KillDisk is a disk-wiping tool designed to overwrite files with random data to render the OS unbootable. It was first observed as a component of BlackEnergy malware during cyber attacks against Ukraine in 2015. KillDisk has since evolved into stand-alone malware used by a variety of threat actors against additional targets in Europe and Latin America; in 2016 a ransomware component was also incorporated into some KillDisk variants.(Citation: KillDisk Ransomware)(Citation: ESEST Black Energy Jan 2"
  - name: "Net"
    mitre_id: "S0039"
    url: "https://attack.mitre.org/software/S0039"
    type: "tool"
    stix_id: "tool--03342581-f790-4f03-ba41-e82e67392e23"
    description: "The Net utility is a component of the Windows operating system. It is used in command-line operations for control of users, groups, services, and network connections. (Citation: Microsoft Net Utility)\n\nNet has a great deal of functionality, (Citation: Savill 1999) much of which is useful for an adversary, such as gathering system and network information for Discovery, moving laterally through SMB/Windows Admin Shares using <code>net use</code> commands, and interacting with services. The net1.exe"
  - name: "PoshC2"
    mitre_id: "S0378"
    url: "https://attack.mitre.org/software/S0378"
    type: "tool"
    stix_id: "tool--4b57c098-f043-4da2-83ef-7588a6d426bc"
    description: "PoshC2 is an open source remote administration and post-exploitation framework that is publicly available on GitHub. The server-side components of the tool are primarily written in Python, while the implants are written in PowerShell. Although PoshC2 is primarily focused on Windows implantation, it does contain a basic Python dropper for Linux/macOS.(Citation: GitHub PoshC2)"
  - name: "Impacket"
    mitre_id: "S0357"
    url: "https://attack.mitre.org/software/S0357"
    type: "tool"
    stix_id: "tool--26c87906-d750-42c5-946c-d4162c73fc7b"
    description: "Impacket is an open source collection of modules written in Python for programmatically constructing and manipulating network protocols. Impacket contains several tools for remote service execution, Kerberos manipulation, Windows credential dumping, packet sniffing, and relay attacks.(Citation: Impacket Tools)"
  - name: "Invoke-PSImage"
    mitre_id: "S0231"
    url: "https://attack.mitre.org/software/S0231"
    type: "tool"
    stix_id: "tool--b52d6583-14a2-4ddc-8527-87fd2142558f"
    description: "Invoke-PSImage takes a PowerShell script and embeds the bytes of the script into the pixels of a PNG image. It generates a one liner for executing either from a file of from the web. Example of usage is embedding the PowerShell code from the Invoke-Mimikatz module and embed it into an image file. By calling the image file from a macro for example, the macro will download the picture and execute the PowerShell code, which in this case will dump the passwords. (Citation: GitHub Invoke-PSImage)"
  - name: "Olympic Destroyer"
    mitre_id: "S0365"
    url: "https://attack.mitre.org/software/S0365"
    type: "malware"
    stix_id: "malware--3249e92a-870b-426d-8790-ba311c1abfb4"
    description: "Olympic Destroyer is malware that was used by Sandworm Team against the 2018 Winter Olympics, held in Pyeongchang, South Korea. The main purpose of the malware was to render infected computer systems inoperable. The malware leverages various native Windows utilities and API calls to carry out its destructive tasks. Olympic Destroyer has worm-like features to spread itself across a computer network in order to maximize its destructive impact.(Citation: Talos Olympic Destroyer 2018)(Citation: US Di"
  - name: "CHEMISTGAMES"
    mitre_id: "S0555"
    url: "https://attack.mitre.org/software/S0555"
    type: "malware"
    stix_id: "malware--a0d774e4-bafc-4292-8651-3ec899391341"
    description: "CHEMISTGAMES is a modular backdoor that has been deployed by Sandworm Team.(Citation: CYBERWARCON CHEMISTGAMES)"
