    type: "malware"
    stix_id: "malware--11194d8b-fdce-45d2-8047-df15bb8f16bd"
    description: "Exaramel for Linux is a backdoor written in the Go Programming Language and compiled as a 64-bit ELF binary. The Windows version is tracked separately under Exaramel for Windows.(Citation: ESET TeleBots Oct 2018)"
  - name: "Exaramel for Windows"
    mitre_id: "S0343"
