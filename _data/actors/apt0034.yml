campaigns:
  - name: "2015 Ukraine Electric Power Attack"
    campaign_id: "C0028"
    url: "https://attack.mitre.org/campaigns/C0028"
    stix_id: "campaign--46421788-b6e1-4256-b351-f8beffd1afba"
    description: "2015 Ukraine Electric Power Attack was a Sandworm Team campaign during which they used BlackEnergy (specifically BlackEnergy3) and KillDisk to target and disrupt transmission and distribution substations within the Ukrainian power grid. This campaign was the first major public attack conducted against the Ukrainian power grid by Sandworm Team."
  - name: "2016 Ukraine Electric Power Attack"
    campaign_id: "C0025"
    url: "https://attack.mitre.org/campaigns/C0025"
    stix_id: "campaign--aa73efef-1418-4dbe-b43c-87a498e97234"
    description: "2016 Ukraine Electric Power Attack was a Sandworm Team campaign during which they used Industroyer malware to target and disrupt distribution substations within the Ukrainian power grid. This campaign was the second major public attack conducted against Ukraine by Sandworm Team.(Citation: ESET Industroyer)(Citation: Dragos Crashoverride 2018)"
  - name: "2022 Ukraine Electric Power Attack"
    campaign_id: "C0034"
    url: "https://attack.mitre.org/campaigns/C0034"
    stix_id: "campaign--df8eb785-70f8-4300-b444-277ba849083d"
    description: "The 2022 Ukraine Electric Power Attack was a Sandworm Team campaign that used a combination of GOGETTER, Neo-REGEORG, CaddyWiper, and living of the land (LotL) techniques to gain access to a Ukrainian electric utility to send unauthorized commands from their SCADA system.(Citation: Mandiant-Sandworm-Ukraine-2022)(Citation: Dragos-Sandworm-Ukraine-2022) "
