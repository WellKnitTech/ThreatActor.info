    stix_id: "malware--051eaca1-958f-4091-9e5f-a9acd8f820b5"
    description: "Exaramel for Windows is a backdoor used for targeting Windows systems. The Linux version is tracked separately under Exaramel for Linux.(Citation: ESET TeleBots Oct 2018)"
  - name: "GreyEnergy"
    mitre_id: "S0342"
