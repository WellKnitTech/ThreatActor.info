name: "DarkLunnen"
aliases: ["DarkLunnen"]
description: "DarkLunnen targeted organizations across Europe using exposed services, known vulnerabilities, and weak or stolen credentials. Its activity included network appliance exploitation, credential theft, webshell tunneling, remote access, internal reconnaissance, and lateral movement. DarkLunnen used a modified watchTowr PoC for FortiGate CVE-2024-55591 to create a backdoor super-admin account named “service”. Group-IB has not linked DarkLunnen to a known actor or established its nationality or state affiliation."
