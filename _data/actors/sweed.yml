operations: ["2017","2018-01","2018-04","2018-05","2019","Beginning in 2019","In April 2018","In May 2018","In early 2018","One of the earliest SWEED campaigns Talos identified dates back to 2017. In this attack","SWEED began making use of a previously disclosed Office exploit. One of the documents featured in these email campaigns was notable because it was a PowerPoint document (PPXS). Code contained inside one of the slides triggers an exploit for CVE-2017-8759","Steganography","a remote code execution bug in Microsoft Office that is commonly observed being leveraged in malicious documents used in commodity malware distribution.","a remote code execution vulnerability in Microsoft .NET framework.","and then attached those ZIPs to emails. The attachments usually had file names similar to “Java_Updater.zip” or “P-O of Jun2017.zip”.","campaigns being conducted by SWEED began leveraging another vulnerability in Microsoft Office: CVE-2017-11882","https://blog.talosintelligence.com/2019/07/sweed-agent-tesla.html","the JAR was directly attached to emails and used file names such as “Order_2018.jar”. The purpose of the JAR was to obtain information about the infected system and facilitate the download of a packed version of Agent Tesla.","the actors placed droppers inside of ZIP archives","the campaigns associated with SWEED began leveraging malicious Office macros. As with previous attacks","they are leveraging spear-phishing emails and malicious attachments to initiate the infection process.","we observed that SWEED began leveraging Java-based droppers. Similar to previous campaigns"]
