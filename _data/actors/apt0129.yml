  type: malware
  stix_id: malware--2ceddaf9-b16a-4f8b-b252-bcccccd3d79f
  description: 'BOOKWORM is a modular trojan known to be leveraged by Mustang Panda
    and was first observed utilized in 2015.  BOOKWORM was later updated in late 2021
