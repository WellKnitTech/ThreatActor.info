software:
- name: CANONSTAGER
  mitre_id: S1237
  url: https://attack.mitre.org/software/S1237
  type: malware
  stix_id: malware--3d1f234e-6c60-43c1-b1f1-6bbc9e5b8e44
  description: 'CANONSTAGER is a loader known to be leveraged by Mustang Panda and
    was first observed utilized in 2025.  Mustang Panda utilizes DLL side-loading
    to execute within the victim environment prior to delivering a follow-on malicious
    encrypted payload.  CANONSTAGER leverages Thread Local Storage (TLS) and Native
    Windows APIs within the victim environment to elude detections. CANONSTAGER also
    hides its code utilizing window procedures and message queues.(Citation: Google
    Threat Intelligence Group MUSTAN'
- name: STATICPLUGIN
  mitre_id: S1238
  url: https://attack.mitre.org/software/S1238
  type: malware
  stix_id: malware--301e7370-c3d3-4f3e-893f-8a79345c2eb5
  description: 'STATICPLUGIN is a downloader known to be leveraged by Mustang Panda
    and was first observed utilized in 2025.  STATICPLUGIN has utilized a valid certificate
    in order to bypass endpoint security protections.  STATICPLUGIN masqueraded as
    legitimate software installer by using a custom TForm.  STATICPLUGIN has been
    leveraged to deploy a loader that facilitates follow on malware.(Citation: Google
    Threat Intelligence Group MUSTANG PANDA PLUGX August 2025)'
- name: ShadowPad
  mitre_id: S0596
  url: https://attack.mitre.org/software/S0596
  type: malware
  stix_id: malware--ec9e00dd-0313-4d5b-8105-c20aa47abffc
  description: 'ShadowPad is a modular backdoor that was first identified in a supply
    chain compromise of the NetSarang software in mid-July 2017. The malware was originally
    thought to be exclusively used by APT41, but has since been observed to be used
    by various Chinese threat activity groups. (Citation: Recorded Future RedEcho
    Feb 2021)(Citation: Securelist ShadowPad Aug 2017)(Citation: Kaspersky ShadowPad
    Aug 2017) '
- name: TONESHELL
  mitre_id: S1239
  url: https://attack.mitre.org/software/S1239
  type: malware
  stix_id: malware--2683fde8-1dc4-415c-94bd-9bb95cc5b7ff
  description: 'TONESHELL is a custom backdoor that has been used since at least Q1
    2021.(Citation: Palo Alto Unit42 STATELY TAURUS TONESHELL September 2023)   TONESHELL
    malware has previously been leveraged by Chinese affiliated actors identified
    as Mustang Panda.(Citation: ATTACKIQ MUSTANG PANDA TONESHELL March 2023)(Citation:
    Zscaler)'
- name: Cobalt Strike
  mitre_id: S0154
  url: https://attack.mitre.org/software/S0154
  type: malware
  stix_id: malware--a7881f21-e978-4fe4-af56-92c9416a2616
  description: |-
    Cobalt Strike is a commercial, full-featured, remote access tool that bills itself as “adversary simulation software designed to execute targeted attacks and emulate the post-exploitation actions of advanced threat actors”. Cobalt Strike’s interactive post-exploit capabilities cover the full range of ATT&CK tactics, all executed within a single, integrated system.(Citation: cobaltstrike manual)

    In addition to its own capabilities, Cobalt Strike leverages the capabilities of other well-known tool
- name: HIUPAN
  mitre_id: S1230
  url: https://attack.mitre.org/software/S1230
  type: malware
  stix_id: malware--da43312a-0188-4949-bab3-0df9a5df0aba
  description: 'HIUPAN (aka U2DiskWatch) is a is a worm that propagates through removable
    drives known to be leveraged by Mustang Panda and was first observed utilized
    in 2024. (Citation: 2025_IBM_PUBLOAD_TONESHELL_HIUPAN_CLAIMLOADER_MUSTANG PANDA)(Citation:
    Trend Micro MUSTANG PANDA PUBLOAD HIUPAN SEPTEMBER 2024)'
- name: Impacket
  mitre_id: S0357
  url: https://attack.mitre.org/software/S0357
  type: tool
  stix_id: tool--26c87906-d750-42c5-946c-d4162c73fc7b
  description: 'Impacket is an open source collection of modules written in Python
    for programmatically constructing and manipulating network protocols. Impacket
    contains several tools for remote service execution, Kerberos manipulation, Windows
    credential dumping, packet sniffing, and relay attacks.(Citation: Impacket Tools)'
- name: SplatCloak
  mitre_id: S1234
  url: https://attack.mitre.org/software/S1234
  type: malware
  stix_id: malware--f39c6d39-0165-46db-a7ae-43341c428d22
  description: 'SplatCloak is a malware that disables EDR-related routines used by
    Windows Defender and Kaspersky to aid in evading detection.  SplatCloak has been
    deployed by SplatDropper and is known to be leveraged by Mustang Panda since 2025.(Citation:
    Zscaler PAKLOG CorkLog SplatCloak Splatdropper April 2025)'
- name: PAKLOG
  mitre_id: S1233
  url: https://attack.mitre.org/software/S1233
  type: malware
  stix_id: malware--0bf64997-7ce1-43e5-b01a-bcd2bf5dc87f
  description: 'PAKLOG is a keylogger known to be leveraged by Mustang Panda and was
    first observed utilized in 2024. PAKLOG is deployed via a RAR archive (e.g., key.rar),
    which contains two files: a signed, legitimate binary (PACLOUD.exe) and the malicious
    PAKLOG DLL (pa_lang2.dll). The PACLOUD.exe binary is used to side-load the PAKLOG
    DLL which starts with the keylogger functionality.(Citation: Zscaler PAKLOG CorkLog
    SplatCloak Splatdropper April 2025)'
- name: Wevtutil
  mitre_id: S0645
  url: https://attack.mitre.org/software/S0645
  type: tool
  stix_id: tool--f91162cc-1686-4ff8-8115-bf3f61a4cc7a
  description: 'Wevtutil is a Windows command-line utility that enables administrators
    to retrieve information about event logs and publishers.(Citation: Wevtutil Microsoft
    Documentation)'
- name: AdFind
  mitre_id: S0552
  url: https://attack.mitre.org/software/S0552
  type: tool
  stix_id: tool--f59508a6-3615-47c3-b493-6676e1a39a87
  description: 'AdFind is a free command-line query tool that can be used for gathering
