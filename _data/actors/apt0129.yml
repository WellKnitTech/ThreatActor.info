- name: Mimikatz
  mitre_id: S0002
  url: https://attack.mitre.org/software/S0002
  type: tool
  stix_id: tool--afc079f3-c0ea-4096-b75d-3f05338b7f60
  description: 'Mimikatz is a credential dumper capable of obtaining plaintext Windows
    account logins and passwords, along with many other features that make it useful
    for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity
    Mimikatz Guide)'
- name: PUBLOAD
  mitre_id: S1228
  url: https://attack.mitre.org/software/S1228
  type: malware
  stix_id: malware--3824852d-1957-4712-9da0-38143723c060
  description: 'PUBLOAD is a stager malware that has been observed installing itself
    in existing directories such as `C:\Users\Public` or creating new directories
    to stage the malware and its components.(Citation: 2022 November_TrendMicro_Earth
    Preta_Toneshell_Pubload)  PUBLOAD malware collects details of the victim host,
    establishes persistence, encrypts victim details using RC4 and communicates victim
    details back to C2.  PUBLOAD malware has previously been leveraged by China-affiliated
    actors identified as Mu'
- name: StarProxy
  mitre_id: S1227
  url: https://attack.mitre.org/software/S1227
  type: malware
  stix_id: malware--e91d3543-ca5d-474b-8b20-5a753ebc6e49
  description: 'StarProxy is custom malware used by Mustang Panda as a post-compromise
    tool, to enable proxying of traffic between the infected machine and other machines
    on the same network. (Citation: Zscaler)'
- name: CorKLOG
  mitre_id: S1235
  url: https://attack.mitre.org/software/S1235
  type: malware
  stix_id: malware--9fd4e24b-3b12-4c7c-925f-226e2e3c3758
  description: 'CorKLOG is a keylogger known to be leveraged by Mustang Panda and
    was first observed utilized in 2024. CorKLOG is delivered through a RAR archive
    (e.g., src.rar), which contains two files: an executable (lcommute.exe) and the
    CorKLOG DLL (mscorsvc.dll).  CorKLOG has established persistence on the system
    by creating services or with scheduled tasks.(Citation: Zscaler PAKLOG CorkLog
    SplatCloak Splatdropper April 2025)'
