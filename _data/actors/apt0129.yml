- name: CLAIMLOADER
  mitre_id: S1236
  url: https://attack.mitre.org/software/S1236
  type: malware
  stix_id: malware--47e4b55a-7803-4bf5-822c-906a1ecbdd6e
  description: 'CLAIMLOADER is a malware variant that frequently accompanies legitimate
    executables that are used for DLL side-loading known to be leveraged by Mustang
    Panda and was first observed utilized in 2021.(Citation: IBM MUSTANG PANDA PUBLOAD
    CLAIMLOADER JUNE 2025)(Citation: 2025_IBM_PUBLOAD_TONESHELL_HIUPAN_CLAIMLOADER_MUSTANG
