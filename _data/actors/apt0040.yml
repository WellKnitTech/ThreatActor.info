software:
  - name: "NDiskMonitor"
    mitre_id: "S0272"
    url: "https://attack.mitre.org/software/S0272"
    type: "malware"
    stix_id: "malware--d1183cb9-258e-4f2f-8415-50ac8252c49e"
    description: "NDiskMonitor is a custom backdoor written in .NET that appears to be unique to Patchwork. (Citation: TrendMicro Patchwork Dec 2017)"
  - name: "QuasarRAT"
    mitre_id: "S0262"
    url: "https://attack.mitre.org/software/S0262"
    type: "tool"
    stix_id: "tool--da04ac30-27da-4959-a67d-450ce47d9470"
    description: "QuasarRAT is an open-source, remote access tool that has been publicly available on GitHub since at least 2014. QuasarRAT is developed in the C# language.(Citation: GitHub QuasarRAT)(Citation: Volexity Patchwork June 2018)"
  - name: "BackConfig"
    mitre_id: "S0475"
    url: "https://attack.mitre.org/software/S0475"
    type: "malware"
    stix_id: "malware--c13d9621-aca7-436b-ab3d-3a95badb3d00"
    description: "BackConfig is a custom Trojan with a flexible plugin architecture that has been used by Patchwork.(Citation: Unit 42 BackConfig May 2020)"
  - name: "TINYTYPHON"
    mitre_id: "S0131"
    url: "https://attack.mitre.org/software/S0131"
    type: "malware"
    stix_id: "malware--85b39628-204a-48d2-b377-ec368cbcb7ca"
    description: "TINYTYPHON is a backdoor  that has been used by the actors responsible for the MONSOON campaign. The majority of its code was reportedly taken from the MyDoom worm. (Citation: Forcepoint Monsoon)"
  - name: "AutoIt backdoor"
    mitre_id: "S0129"
    url: "https://attack.mitre.org/software/S0129"
    type: "malware"
    stix_id: "malware--f5352566-1a64-49ac-8f7f-97e1d1a03300"
    description: "AutoIt backdoor is malware that has been used by the actors responsible for the MONSOON campaign. The actors frequently used it in weaponized .pps files exploiting CVE-2014-6352. (Citation: Forcepoint Monsoon) This malware makes use of the legitimate scripting language for Windows GUI automation with the same name."
  - name: "PowerSploit"
    mitre_id: "S0194"
    url: "https://attack.mitre.org/software/S0194"
    type: "tool"
    stix_id: "tool--13cd9151-83b7-410d-9f98-25d0f0d1d80d"
    description: "PowerSploit is an open source, offensive security framework comprised of PowerShell modules and scripts that perform a wide range of tasks related to penetration testing such as code execution, persistence, bypassing anti-virus, recon, and exfiltration. (Citation: GitHub PowerSploit May 2012) (Citation: PowerShellMagazine PowerSploit July 2014) (Citation: PowerSploit Documentation)"
  - name: "BADNEWS"
    mitre_id: "S0128"
    url: "https://attack.mitre.org/software/S0128"
    type: "malware"
    stix_id: "malware--e9595678-d269-469e-ae6b-75e49259de63"
    description: "BADNEWS is malware that has been used by the actors responsible for the Patchwork campaign. Its name was given due to its use of RSS feeds, forums, and blogs for command and control. (Citation: Forcepoint Monsoon) (Citation: TrendMicro Patchwork Dec 2017)"
  - name: "Unknown Logger"
    mitre_id: "S0130"
    url: "https://attack.mitre.org/software/S0130"
    type: "malware"
    stix_id: "malware--ab3580c8-8435-4117-aace-3d9fbe46aa56"
    description: "Unknown Logger is a publicly released, free backdoor. Version 1.5 of the backdoor has been used by the actors responsible for the MONSOON campaign. (Citation: Forcepoint Monsoon)"
  - name: "VajraSpy"
    mitre_id: "S9006"
    url: "https://attack.mitre.org/software/S9006"
    type: "malware"
    stix_id: "malware--8205a875-3ed5-4be2-ab9b-14a7d29431d0"
    description: "VajraSpy is Android malware distributed via trojanized messaging and news applications. It has been used to target individuals in Pakistan and India since at least 2021 and has been delivered through the Google Play Store, malicious domains, and other uncontrolled distribution channels. VajraSpy is attributed with high confidence to Patchwork which has used the malware to conduct targeted espionage, primarily against devices in Pakistan.(Citation: ESET_VajraSpy_Feb2024)(Citation: ArcticWolf_Dropp"
