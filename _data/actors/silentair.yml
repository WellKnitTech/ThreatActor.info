name: "SilentAir"
aliases: ["SilentAir"]
description: "SilentAir is a state-level threat actor assessed with low confidence to be aligned with China-nexus operations. It primarily targets Taiwan and launches attacks from hijacked mobile operator nodes, mostly over SS7 and sometimes Diameter. By manipulating subscriber location updates, SilentAir redirects incoming calls and SMS messages through compromised nodes for interception and harvests subscriber details. It also sends silent SMS messages, potentially to verify continued interception."
