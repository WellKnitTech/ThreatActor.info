operations: ["2013","2015","2017-01","As part of our monitoring of Iranian threat agents activities","Breach of the Israeli newspaper Jerusalem Post","CopyKittens has conducted at least three waves of cyber-attacks in the past year. In each of the attacks the infection method was almost identical and included an extraordinary number of stages used to avoid detection. As with other common threat actors","In this report","Operation “Wilted Tulip”","Trend Micro and ClearSky expose a vast espionage apparatus spanning the entire time the group has been active. It includes recent incidents as well as older ones that have not been publicly reported","and the group’s modus operandi. We dubbed this activity Operation Wilted Tulip.","as well as multiple other Israeli websites and one website in the Palestinian Authority were compromised by Iranian threat agent CopyKittens.","delivery and command and control infrastructure","exploitation","https://s3-eu-west-1.amazonaws.com/minervaresearchpublic/CopyKittens/CopyKittens.pdf","https://www.clearskysec.com/copykitten-jpost/","https://www.clearskysec.com/wp-content/uploads/2017/07/Operation_Wilted_Tulip.pdf","new malware","the Jerusalem Post","the group relies on social engineering methods to deceive its targets prior to infection.","we have detected that since October 2016 and until the end of January 2017"]
