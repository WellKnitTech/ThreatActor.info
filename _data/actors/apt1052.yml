software:
  - name: "InvisibleFerret"
    mitre_id: "S1245"
    url: "https://attack.mitre.org/software/S1245"
    type: "malware"
    stix_id: "malware--1dac60f2-7d53-4a3e-95d1-cb2e875d5491"
    description: "InvisibleFerret is a modular python malware that is leveraged for data exfiltration and remote access capabilities.(Citation: ESET Contagious Interview BeaverTail InvisibleFerret February 2025)(Citation: Zscaler ContagiousInterview BeaverTail InvisibleFerret November 2024)(Citation: PaloAlto ContagiousInterview BeaverTail InvisibleFerret November 2023)   InvisibleFerret consists of four modules: main, payload, browser, and AnyDesk.(Citation: ESET Contagious Interview BeaverTail InvisibleFerret Fe"
  - name: "BeaverTail"
    mitre_id: "S1246"
    url: "https://attack.mitre.org/software/S1246"
    type: "malware"
    stix_id: "malware--6055aee2-d1c6-4877-94e9-a3bde9936470"
    description: "BeaverTail is a malware that has both a JavaScript and C++ variant.  Active since 2022, BeaverTail is capable of stealing logins from browsers and serves as a downloader for second stage payloads. BeaverTail has previously been leveraged by North Korea-affiliated actors identified as DeceptiveDevelopment or Contagious Interview. BeaverTail has been delivered to victims through code repository sites and has been embedded within malicious attachments.(Citation: PaloAlto ContagiousInterview BeaverTa"
  - name: "XORIndex Loader"
    mitre_id: "S1248"
    url: "https://attack.mitre.org/software/S1248"
    type: "malware"
    stix_id: "malware--fedd9fcd-1f9c-4be0-9d84-f31e88eb6664"
    description: "XORIndex Loader is a XOR-encoded loader that collects host data, decodes follow-on scripts and acts as a downloader for the BeaverTail malware.  XORIndex Loader was first reported in June 2025.  XORIndex Loader has been leveraged by North Korea-affiliated threat actors identified as Contagious Interview.  XORIndex Loader has been delivered to victims through code repository sites utilizing typo squatting naming conventions of various npm packages.(Citation: Socket BeaverTail XORIndex HexEval Cont"
  - name: "HexEval Loader"
    mitre_id: "S1249"
    url: "https://attack.mitre.org/software/S1249"
    type: "malware"
    stix_id: "malware--3d7048f1-012e-468c-a18b-1bf98037d62c"
    description: "HexEval Loader is a hex-encoded loader that collects host data, decodes follow-on scripts and acts as a downloader for the BeaverTail malware.  HexEval Loader was first reported in April 2025.  HexEval Loader has previously been leveraged by North Korea-affiliated threat actors identified as Contagious Interview.  HexEval Loader has been delivered to victims through code repository sites utilizing typosquatting naming conventions of various npm packages.(Citation: Socket Contagious Interview NPM "
