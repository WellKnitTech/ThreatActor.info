software:
  - name: "PlugX"
    mitre_id: "S0013"
    url: "https://attack.mitre.org/software/S0013"
    type: "malware"
    stix_id: "malware--64fa0de0-6240-41f4-8638-f4ca7ed528fd"
    description: "PlugX is a remote access tool (RAT) with modular plugins that has been used by multiple threat groups.(Citation: Lastline PlugX Analysis)(Citation: FireEye Clandestine Fox Part 2)(Citation: New DragonOK)(Citation: Dell TG-3390)"
  - name: "MgBot"
    mitre_id: "S1146"
    url: "https://attack.mitre.org/software/S1146"
    type: "malware"
    stix_id: "malware--a36eedea-9523-4abb-96e8-205f171ee763"
    description: "MgBot is a modular malware framework exclusively associated with Daggerfly operations since at least 2012. MgBot was developed in C++ and features a module design with multiple available plugins that have been under active development through 2024.(Citation: Szappanos MgBot 2014)(Citation: ESET EvasivePanda 2023)(Citation: Symantec Daggerfly 2024)"
  - name: "BITSAdmin"
    mitre_id: "S0190"
    url: "https://attack.mitre.org/software/S0190"
    type: "tool"
    stix_id: "tool--64764dc6-a032-495f-8250-1e4c06bdc163"
    description: "BITSAdmin is a command line tool used to create and manage BITS Jobs. (Citation: Microsoft BITSAdmin)"
  - name: "MacMa"
    mitre_id: "S1016"
    url: "https://attack.mitre.org/software/S1016"
    type: "malware"
    stix_id: "malware--bdee9574-7479-4073-a7dc-e86d8acd073a"
    description: "MacMa is a macOS-based backdoor with a large set of functionalities to control and exfiltrate files from a compromised computer. MacMa has been observed in the wild since November 2021.(Citation: ESET DazzleSpy Jan 2022) MacMa shares command and control and unique libraries with MgBot and Nightdoor, indicating a relationship with the Daggerfly threat actor.(Citation: Symantec Daggerfly 2024)"
  - name: "Nightdoor"
    mitre_id: "S1147"
    url: "https://attack.mitre.org/software/S1147"
    type: "malware"
    stix_id: "malware--51f78dfc-52f9-424e-8753-bb4246188313"
    description: "Nightdoor is a backdoor exclusively associated with Daggerfly operations. Nightdoor uses common libraries with MgBot and MacMa, linking these malware families together.(Citation: ESET EvasivePanda 2024)(Citation: Symantec Daggerfly 2024)"
  - name: "Reg"
    mitre_id: "S0075"
    url: "https://attack.mitre.org/software/S0075"
    type: "tool"
    stix_id: "tool--cde2d700-9ed1-46cf-9bce-07364fe8b24f"
    description: "Reg is a Windows utility used to interact with the Windows Registry. It can be used at the command-line interface to query, add, modify, and remove information. (Citation: Microsoft Reg)\n\nUtilities such as Reg are known to be used by persistent threats. (Citation: Windows Commands JPCERT)"
