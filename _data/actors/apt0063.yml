operations: ["2015-06","2016","2016-05","2017","2017-09","2017-10","Adobe warned of a vulnerability (CVE-2016-4117) affecting Flash Player 21.0.0.226 and earlier versions for Windows","FireEye recently detected a malicious Microsoft Office RTF document that leveraged CVE-2017-8759","Kaspersky Lab’s advanced exploit prevention systems identified a new Adobe Flash zero day exploit used in the wild against our customers. The exploit was delivered through a Microsoft Office document and the final payload was the latest version of FinSpy malware.","Leveraging data from Kaspersky Security Network","Linux","Macintosh","On October 10","We first became aware of BlackOasis’ activities in May 2016","a SOAP WSDL parser code injection vulnerability. This vulnerability allows a malicious actor to inject arbitrary code during the parsing of SOAP WSDL definition contents.","and Chrome OS. The vulnerability was actively being exploited in the wild.","https://securelist.com/blackoasis-apt-and-new-targeted-attacks-leveraging-zero-day-exploit/82732/","https://www.fireeye.com/blog/threat-research/2017/09/zero-day-used-to-distribute-finspy.html","we identified two other similar exploit chains used by BlackOasis in June 2015 which were zero days at the time. Those include CVE-2015-5119 and CVE-2016-0984","which were patched in July 2015 and February 2016 respectively. These exploit chains also delivered FinSpy installation packages.","while investigating another Adobe Flash zero day. On May 10"]
