name: "RedCurl"
aliases: ["RedCurl"]
description: "RedCurl is a threat actor active since 2018 notable for corporate espionage targeting a variety of locations, including Ukraine, Canada and the United Kingdom, and a variety of industries, including but not limited to travel agencies, insurance companies, and banks. [group-ib_redcurl1](https://www.group-ib.com/resources/research-hub/red-curl/) RedCurl is allegedly a Russian-speaking threat actor. [group-ib_redcurl1](https://www.group-ib.com/resources/research-hub/red-curl/) [group-ib_redcurl2](https://www.group-ib.com/resources/research-hub/red-curl-2/) The group’s operations typically start with spearphishing emails to gain initial access, then the group executes discovery and collection commands and scripts to find corporate data. The group concludes operations by exfiltrating files to the C2 servers. "
