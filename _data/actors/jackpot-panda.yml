description: Jackpot Panda is a China-nexus state-sponsored APT primarily focused
  on cyber espionage against East and Southeast Asian entities, particularly in the
  online gambling sector and domestic security. They rapidly exploited CVE-2025-55182
  using automated scanning, reconnaissance commands, and multi-vulnerability campaigns.
  Their activities have been linked to infrastructure associated with the exploitation
  of trojanized platforms and malware deployment, including SNOWLIGHT and VShell.
