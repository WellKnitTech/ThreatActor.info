description: '8Base emerged in early 2022 and rapidly escalated its ransomware operations
  by mid-2023, positioning itself as a “simple pen tester” while executing a relentless
  double-extortion scheme: encrypting files using AES-256 CBC mode (appending the
  “.8base” extension) and threatening to leak stolen data via a Tor-accessible leak
  site. The group leverages initial access methods such as phishing and SmokeLoader,
  disables security mechanisms like Volume Shadow Copy and firewalls, and deploys
  persistence via registry and startup entries. Targeting primarily small and medium-sized
  organizations across sectors such as manufacturing, finance, IT, and healthcare
  in regions including the U.S., Brazil, and Europe, 8Base has drawn comparisons to
  Phobos and RansomHouse for its tactics and ransom-note style. In early 2025, international
  law enforcement operations disrupted the group, resulting in the arrest of four
  key actors, seizure of servers, and warnings to hundreds of potential victims.'
