software:
  - name: "QakBot"
    mitre_id: "S0650"
    url: "https://attack.mitre.org/software/S0650"
    type: "malware"
    stix_id: "malware--edc5e045-5401-42bb-ad92-52b5b2ee0de9"
    description: "QakBot is a modular banking trojan that has been used primarily by financially-motivated actors since at least 2007. QakBot is continuously maintained and developed and has evolved from an information stealer into a delivery agent for ransomware, most notably ProLock and Egregor.(Citation: Trend Micro Qakbot December 2020)(Citation: Red Canary Qbot)(Citation: Kaspersky QakBot September 2021)(Citation: ATT QakBot April 2021)"
  - name: "IcedID"
    mitre_id: "S0483"
    url: "https://attack.mitre.org/software/S0483"
    type: "malware"
    stix_id: "malware--5147ef15-1cae-4707-8ea1-bee8d98b7f1d"
    description: "IcedID is a modular banking malware designed to steal financial information that has been observed in the wild since at least 2017.  IcedID  has been downloaded by Emotet in multiple campaigns.(Citation: IBM IcedID November 2017)(Citation: Juniper IcedID June 2020)"
  - name: "Valak"
    mitre_id: "S0476"
    url: "https://attack.mitre.org/software/S0476"
    type: "malware"
    stix_id: "malware--ade37ada-14af-4b44-b36c-210eec255d53"
    description: "Valak is a multi-stage modular malware that can function as a standalone information stealer or downloader, first observed in 2019 targeting enterprises in the US and Germany.(Citation: Cybereason Valak May 2020)(Citation: Unit 42 Valak July 2020)"
  - name: "Sliver"
    mitre_id: "S0633"
    url: "https://attack.mitre.org/software/S0633"
    type: "tool"
    stix_id: "tool--11f8d7eb-1927-4806-9267-3a11d4d4d6be"
    description: "Sliver is an open source, cross-platform, red team command and control (C2) framework written in Golang. Sliver includes its own package manager, \"armory,\" for staging and downloading additional tools and payloads to the primary C2 framework.(Citation: Bishop Fox Sliver Framework August 2019)(Citation: Cybereason Sliver Undated)"
  - name: "Ursnif"
    mitre_id: "S0386"
    url: "https://attack.mitre.org/software/S0386"
    type: "malware"
    stix_id: "malware--1492d0f8-7e14-4af3-9239-bc3fe10d3407"
    description: "Ursnif is a banking trojan and variant of the Gozi malware observed being spread through various automated exploit kits, Spearphishing Attachments, and malicious links.(Citation: NJCCIC Ursnif Sept 2016)(Citation: ProofPoint Ursnif Aug 2016) Ursnif is associated primarily with data theft, but variants also include components (backdoors, spyware, file injectors, etc.) capable of a wide variety of behaviors.(Citation: TrendMicro Ursnif Mar 2015)"
