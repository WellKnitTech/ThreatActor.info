name: "TA551"
aliases: ["ATK236","G0127","GOLD CABIN","Monster Libra","Shakthak","Shathak","TA551"]
description: "TA551 is a financially-motivated threat group that has been active since at least 2018. [Secureworks GOLD CABIN](https://www.secureworks.com/research/threat-profiles/gold-cabin) The group has primarily targeted English, German, Italian, and Japanese speakers through email-based malware distribution campaigns. [Unit 42 TA551 Jan 2021](https://unit42.paloaltonetworks.com/ta551-shathak-icedid/)"
