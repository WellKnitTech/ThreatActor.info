description: BlackCat (ALPHV) is ransomware written in Rust. The ransomware makes
  heavy use of plaintext JSON configuration files to specify the ransomware functionality.
  BlackCat has many advanced capabilities like escalating privileges and bypassing
  UAC make use of AES and ChaCha20 or Salsa encryption, may use the Restart Manager,
  can delete volume shadow copies, can enumerate disk volumes and network shares automatically,
  and may kill specific processes and services. The ransomware exists for both Windows,
  Linux, and ESXi systems. Multiple extortion techniques are used by the BlackCat
  gang, such as exfiltrating victim data before the ransomware deployment, threats
  to release data if the ransomw is not paid, and distributed denial-of-service (DDoS)
  attacks.
