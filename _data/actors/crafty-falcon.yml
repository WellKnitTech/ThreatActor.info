name: "CRAFTY FALCON"
aliases: ["CRAFTY FALCON"]
description: "Crafty Falcon is an AI-assisted threat actor targeting Indian fintechs, lenders, payment firms and cryptocurrency exchanges. It exploits exposed test environments and shared credentials, then moves money through victims’ payment and disbursement APIs. Its tooling includes ARTEX, PentAGI, Cairn and CyberStrikeAI, and it rotates C2 infrastructure within hours to days."
