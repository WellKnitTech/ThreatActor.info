operations: ["2014","2014 we notified Group-IB Bot-Trek Intelligence subscribers about phishing emails which were sent from the info@beeline-mail.ru address with the subject “Invoice No 522375-ФЛОРЛ-14-115” (pic. 1). The beeline-mail.ru domain name was also registered on October 20","2014.","2015-10","2015-12","2016-09","2017","2019-06","Breach of the Russian boxing site allboxing[.].ru","Buhtrap resurfaced in the beginning of 2017 in the TwoBee campaign","CVE-2019-1132","In December 2015","On October 20","Operation “TwoBee”","Throughout our tracking","We noticed in late October that users visiting the Ammyy website to download the free version of its remote administrator software were being served a bundle containing not only the legitimate Remote Desktop Software Ammyy Admin","a common technique in attack campaigns. The emails were made to look like they were from the Central Bank of Russia and offered employment to their recipients. Instead of being an actual employment offer","against one of its victims.","but June 2019 was the first time we saw the Buhtrap group use a zero-day exploit as part of a campaign. In that case","but also an NSIS (Nullsoft Scriptable Installation Software) installer ultimately intended to install the tools used by the Buhtrap gang to spy on and control their victims’ computers.","employees from several Russian banks were targeted with spoofed emails","https://www.forcepoint.com/blog/security-labs/highly-evasive-code-injection-awaits-user-interaction-delivering-malware","https://www.group-ib.com/brochures/gib-buhtrap-report.pdf","https://www.kaspersky.com/blog/financial-trojans-2019/25690/","https://www.symantec.com/connect/blogs/russian-bank-employees-received-fake-job-offers-targeted-email-attack","https://www.welivesecurity.com/2015/11/11/operation-buhtrap-malware-distributed-via-ammyy-com/","https://www.welivesecurity.com/2019/07/11/buhtrap-zero-day-espionage-campaigns/","it hit the news (literally)","spreading through several compromised major news outlets in whose main pages malicious actors implanted scripts. This scripts executed an exploit for Internet Explorer in visitor’s browsers.","the emails were an attempt to deliver Trojan.Ratopak onto the target’s computer.","we observed Buhtrap using a local privilege escalation exploit","we’ve seen this group deploy its main backdoor as well as other tools against various victims","where it served primarily as means of malware delivery. In March of last year"]
