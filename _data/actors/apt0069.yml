  type: malware
  stix_id: malware--6d5c257d-e6de-4c95-a7e8-09ac9386007d
  description: 'DCHSpy is an Android spyware likely used by MuddyWater. DCHSpy uses
    political decoys and masquerades as legitimate applications, such as VPNs and
    banking applications, to trick victims into downloading the malware. Once downloaded,
    DCHSpy collects information from the device and exfiltrates the data to the command
    and control (C2) server.(Citation: Lookout_DCHSpy_July2025) '
