description: Magic Hound is an Iranian-sponsored threat group that conducts long term,
  resource-intensive cyber espionage operations, likely on behalf of the Islamic Revolutionary
  Guard Corps. They have targeted European, U.S., and Middle Eastern government and
  military personnel, academics, journalists, and organizations such as the World
  Health Organization (WHO), via complex social engineering campaigns since at least
  2014. [FireEye APT35 2018](https://static.carahsoft.com/concrete/files/1015/2779/3571/M-Trends-2018-Report.pdf)
  [ClearSky Kittens Back 3 August 2020](https://www.clearskysec.com/wp-content/uploads/2020/08/The-Kittens-are-Back-in-Town-3.pdf)
