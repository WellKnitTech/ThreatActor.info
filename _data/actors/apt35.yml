- IBM X-Force IRIS discovered the 40 GBs of video and data files being uploaded to
  a server that hosted numerous ITG18 domains used in earlier 2020 activity. Some
  of the videos showed the operator managing adversary-created accounts while others
  showed the operator testing access and exfiltrating data from previously compromised
  accounts.
