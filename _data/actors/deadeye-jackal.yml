operations: ["2016 Mid","2018-01","In recent years","Lookout researchers have uncovered a long-running surveillance campaign tied to Syrian nation-state actors","but the SEA hasn't ceased activity: it's altered tactics and is now delivering custom Android malware to opponents of the Assad regime for the purposes of surveillance.","https://blog.lookout.com/nation-state-mobile-malware-targets-syrians-with-covid-19-lures","https://www.zdnet.com/article/these-hackers-are-using-android-surveillance-malware-to-target-opponents-of-the-syrian-government/","the group has seemingly kept a low profile","which recently started using the novel coronavirus as its newest lure to entice its targets to download malware."]
