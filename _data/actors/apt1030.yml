software:
  - name: "NBTscan"
    mitre_id: "S0590"
    url: "https://attack.mitre.org/software/S0590"
    type: "tool"
    stix_id: "tool--b63970b7-ddfb-4aee-97b1-80d335e033a8"
    description: "NBTscan is an open source tool that has been used by state groups to conduct internal reconnaissance within a compromised network.(Citation: Debian nbtscan Nov 2019)(Citation: SecTools nbtscan June 2003)(Citation: Symantec Waterbug Jun 2019)(Citation: FireEye APT39 Jan 2019)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "IPsec Helper"
    mitre_id: "S1132"
    url: "https://attack.mitre.org/software/S1132"
    type: "malware"
    stix_id: "malware--b5dc19b7-588d-403b-848d-c868bd61ffa1"
    description: "IPsec Helper is a post-exploitation remote access tool linked to Agrius operations. This malware shares significant programming and functional overlaps with Apostle ransomware, also linked to Agrius. IPsec Helper provides basic remote access tool functionality such as uploading files from victim systems, running commands, and deploying additional payloads.(Citation: SentinelOne Agrius 2021)"
  - name: "Moneybird"
    mitre_id: "S1137"
    url: "https://attack.mitre.org/software/S1137"
    type: "malware"
    stix_id: "malware--47ab6350-054f-4754-ba4d-e52a4e8751e2"
    description: "Moneybird is a ransomware variant written in C++ associated with Agrius operations. The name \"Moneybird\" is contained in the malware's ransom note and as strings in the executable.(Citation: CheckPoint Agrius 2023)"
  - name: "MultiLayer Wiper"
    mitre_id: "S1135"
    url: "https://attack.mitre.org/software/S1135"
    type: "malware"
    stix_id: "malware--663d7dee-5a47-459e-a5ef-e850a94a8ee5"
    description: "MultiLayer Wiper is wiper malware written in .NET associated with Agrius operations. Observed samples of MultiLayer Wiper have an anomalous, future compilation date suggesting possible metadata manipulation.(Citation: Unit42 Agrius 2023)"
  - name: "DEADWOOD"
    mitre_id: "S1134"
    url: "https://attack.mitre.org/software/S1134"
    type: "malware"
    stix_id: "malware--f2e6af17-3828-4f10-88e7-343591618ddb"
    description: "DEADWOOD is wiper malware written in C++ using Boost libraries. DEADWOOD was first observed in an unattributed wiping event in Saudi Arabia in 2019, and has since been incorporated into Agrius operations.(Citation: SentinelOne Agrius 2021)"
  - name: "BFG Agonizer"
    mitre_id: "S1136"
    url: "https://attack.mitre.org/software/S1136"
    type: "malware"
    stix_id: "malware--d6aefbbf-fbef-485a-973e-b5403d8f8b18"
    description: "BFG Agonizer is a wiper related to the open-source project CRYLINE-v.5.0. The malware is associated with wiping operations conducted by the Agrius threat actor.(Citation: Unit42 Agrius 2023)"
  - name: "ASPXSpy"
    mitre_id: "S0073"
    url: "https://attack.mitre.org/software/S0073"
    type: "malware"
    stix_id: "malware--56f46b17-8cfa-46c0-b501-dd52fef394e2"
    description: "ASPXSpy is a Web shell. It has been modified by Threat Group-3390 actors to create the ASPXTool version. (Citation: Dell TG-3390)"
  - name: "Apostle"
    mitre_id: "S1133"
    url: "https://attack.mitre.org/software/S1133"
    type: "malware"
    stix_id: "malware--48d96fa0-d027-45aa-a8c3-5d09f65d596d"
    description: "Apostle is malware that has functioned as both a wiper and, in more recent versions, as ransomware.  Apostle is written in .NET and shares various programming and functional overlaps with IPsec Helper.(Citation: SentinelOne Agrius 2021)"
