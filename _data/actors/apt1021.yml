software:
  - name: "Sliver"
    mitre_id: "S0633"
    url: "https://attack.mitre.org/software/S0633"
    type: "tool"
    stix_id: "tool--11f8d7eb-1927-4806-9267-3a11d4d4d6be"
    description: "Sliver is an open source, cross-platform, red team command and control (C2) framework written in Golang. Sliver includes its own package manager, \"armory,\" for staging and downloading additional tools and payloads to the primary C2 framework.(Citation: Bishop Fox Sliver Framework August 2019)(Citation: Cybereason Sliver Undated)"
  - name: "Pandora"
    mitre_id: "S0664"
    url: "https://attack.mitre.org/software/S0664"
    type: "malware"
    stix_id: "malware--a545456a-f9a7-47ad-9ea6-8b017def38d1"
    description: "Pandora is a multistage kernel rootkit with backdoor functionality that has been in use by Threat Group-3390 since at least 2020.(Citation: Trend Micro Iron Tiger April 2021)"
  - name: "PlugX"
    mitre_id: "S0013"
    url: "https://attack.mitre.org/software/S0013"
    type: "malware"
    stix_id: "malware--64fa0de0-6240-41f4-8638-f4ca7ed528fd"
    description: "PlugX is a remote access tool (RAT) with modular plugins that has been used by multiple threat groups.(Citation: Lastline PlugX Analysis)(Citation: FireEye Clandestine Fox Part 2)(Citation: New DragonOK)(Citation: Dell TG-3390)"
  - name: "Cheerscrypt"
    mitre_id: "S1096"
    url: "https://attack.mitre.org/software/S1096"
    type: "malware"
    stix_id: "malware--5d3fa1db-5041-4560-b87b-8f61cc225c52"
    description: "Cheerscrypt is a ransomware that was developed by Cinnamon Tempest and has been used in attacks against ESXi and Windows environments since at least 2022. Cheerscrypt was derived from the leaked Babuk source code and has infrastructure overlaps with deployments of Night Sky ransomware, which was also derived from Babuk.(Citation: Sygnia Emperor Dragonfly October 2022)(Citation: Trend Micro Cheerscrypt May 2022)"
  - name: "Impacket"
    mitre_id: "S0357"
    url: "https://attack.mitre.org/software/S0357"
    type: "tool"
    stix_id: "tool--26c87906-d750-42c5-946c-d4162c73fc7b"
    description: "Impacket is an open source collection of modules written in Python for programmatically constructing and manipulating network protocols. Impacket contains several tools for remote service execution, Kerberos manipulation, Windows credential dumping, packet sniffing, and relay attacks.(Citation: Impacket Tools)"
  - name: "Cobalt Strike"
    mitre_id: "S0154"
    url: "https://attack.mitre.org/software/S0154"
    type: "malware"
    stix_id: "malware--a7881f21-e978-4fe4-af56-92c9416a2616"
    description: "Cobalt Strike is a commercial, full-featured, remote access tool that bills itself as “adversary simulation software designed to execute targeted attacks and emulate the post-exploitation actions of advanced threat actors”. Cobalt Strike’s interactive post-exploit capabilities cover the full range of ATT&CK tactics, all executed within a single, integrated system.(Citation: cobaltstrike manual)\n\nIn addition to its own capabilities, Cobalt Strike leverages the capabilities of other well-known tool"
  - name: "HUI Loader"
    mitre_id: "S1097"
    url: "https://attack.mitre.org/software/S1097"
    type: "malware"
    stix_id: "malware--54089fba-8662-4f37-9a44-6ad25a5f630a"
    description: "HUI Loader is a custom DLL loader that has been used since at least 2015 by China-based threat groups including Cinnamon Tempest and menuPass to deploy malware on compromised hosts. HUI Loader has been observed in campaigns loading SodaMaster, PlugX, Cobalt Strike, Komplex, and several strains of ransomware.(Citation: SecureWorks BRONZE STARLIGHT Ransomware Operations June 2022)"
  - name: "Rclone"
    mitre_id: "S1040"
    url: "https://attack.mitre.org/software/S1040"
    type: "tool"
    stix_id: "tool--59096109-a1dd-463b-87e7-a8d110fe3a79"
    description: "Rclone is a command line program for syncing files with cloud storage services such as Dropbox, Google Drive, Amazon S3, and MEGA. Rclone has been used in a number of ransomware campaigns, including those associated with the Conti and DarkSide Ransomware-as-a-Service operations.(Citation: Rclone)(Citation: Rclone Wars)(Citation: Detecting Rclone)(Citation: DarkSide Ransomware Gang)(Citation: DFIR Conti Bazar Nov 2021)"
