software:
  - name: "CRASHPAD"
    mitre_id: "S9057"
    url: "https://attack.mitre.org/software/S9057"
    type: "malware"
    stix_id: "malware--b7c4047f-d56b-43b7-a0c8-65088a70d0cc"
    description: "CRASHPAD is a Windows executable written in C++ that gathers data from web browsers.(Citation: Mandiant_UNC1549_Nov2025)  CRASHPAD  was first observed in 2025 and has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025) "
  - name: "MiniBus"
    mitre_id: "S9060"
    url: "https://attack.mitre.org/software/S9060"
    type: "malware"
    stix_id: "malware--8b325e28-6ea1-4094-929b-966d5db4ee4c"
    description: "MiniBus is a custom backdoor used for command execution, data discovery, gathering, and exfiltration. MiniBus has utilized Azure Cloud Infrastructure and unique adversary-controlled domains for command and control. MiniBus is an updated platform to its predecessor MiniBike and was first observed in August 2023. MiniBus has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Feb2024) "
  - name: "DCSYNCER.SLICK"
    mitre_id: "S9065"
    url: "https://attack.mitre.org/software/S9065"
    type: "malware"
    stix_id: "malware--e6de8db2-092a-476c-a683-ad6e042a3265"
    description: "DCSYNCER.SLICK is a Windows executable that is designed to gather credentials from victim devices.(Citation: Mandiant_UNC1549_Nov2025) DCSYNCER.SLICK was first observed in 2025 and has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025)"
  - name: "TRUSTTRAP"
    mitre_id: "S9064"
    url: "https://attack.mitre.org/software/S9064"
    type: "malware"
    stix_id: "malware--e60b857a-afe6-4f3a-b308-664d51768610"
    description: "TRUSTTRAP is a malware that uses a fictitious prompt to trick users to submit their credentials.(Citation: Mandiant_UNC1549_Nov2025) TRUSTTRAP was first observed in 2023 and has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025)"
  - name: "TWOSTROKE"
    mitre_id: "S9067"
    url: "https://attack.mitre.org/software/S9067"
    type: "malware"
    stix_id: "malware--86adfd9a-6092-4714-9c5a-a05c5e3f63b5"
    description: "TWOSTROKE is malicious backdoor written in C++ that is capable of discovery actions, executing payloads and exfiltrating data.(Citation: Mandiant_UNC1549_Nov2025) TWOSTROKE was first observed in 2025 and has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025)"
  - name: "MiniFast"
    mitre_id: "S9052"
    url: "https://attack.mitre.org/software/S9052"
    type: "malware"
    stix_id: "malware--363bc9c0-6e9b-4815-a072-1a92d0ad7502"
    description: "MiniFast is a custom malware designed for long-term persistence and remote code execution. MiniFast is a modular malware suspected of being generated using artificial intelligence (AI). MiniFast was first observed in early-2026 and is a modified version of the MiniJunk framework. MiniFast has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: CheckPoint_NimbusManticore_May2026) "
  - name: "MiniJunk"
    mitre_id: "S9053"
    url: "https://attack.mitre.org/software/S9053"
    type: "malware"
    stix_id: "malware--7eaf437c-cde7-475b-87dd-d8573ca5406b"
    description: "MiniJunk is a custom malware designed for long-term persistence and remote code execution.(Citation: CheckPoint_NimbusManticoreEurope_Sept2025) MiniJunk  was first observed in 2025 and is a modified version of the MiniBike framework that was first observed in June 2022.(Citation: CheckPoint_NimbusManticoreEurope_Sept2025) MiniJunk has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: CheckPoint_NimbusManticoreEurope_Sept2025)"
  - name: "LIGHTRAIL"
    mitre_id: "S9061"
    url: "https://attack.mitre.org/software/S9061"
    type: "malware"
    stix_id: "malware--0bbfc4cf-818d-4ef0-97e0-15b423c85b08"
    description: "LIGHTRAIL is a tunneler malware.(Citation: Mandiant_UNC1549_Feb2024) LIGHTRAIL has been known to communicate with C2 SOCKS4A Websocket communications.(Citation: Mandiant_UNC1549_Feb2024) LIGHTRAIL was first observed in 2022. LIGHTRAIL has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Feb2024)(Citation: Mandiant_UNC1549TTPsTools_Nov2025) "
  - name: "MiniBrowse"
    mitre_id: "S9062"
    url: "https://attack.mitre.org/software/S9062"
    type: "malware"
    stix_id: "malware--8c8b765a-fba0-4551-ae83-b12e2a8b8937"
    description: "MiniBrowse is a custom stealer designed for the theft of credentials in browsers and passwords stores. MiniBrowse was first observed in late-2025.(Citation: CheckPoint_NimbusManticoreEurope_Sept2025) MiniBrowse has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: CheckPoint_NimbusManticoreEurope_Sept2025)"
  - name: "MiniBike"
    mitre_id: "S9059"
    url: "https://attack.mitre.org/software/S9059"
    type: "malware"
    stix_id: "malware--1cf09c8f-32e1-404c-bb1e-4ac9ee7c5191"
    description: "MiniBike is a custom backdoor written in C++ designed for command execution, data discovery, gathering, and exfiltration.(Citation: Mandiant_UNC1549_Feb2024)  MiniBike has been known to communicate with the C2 using Azure Cloud Infrastructure. MiniBike was first observed in 2022.(Citation: Mandiant_UNC1549_Feb2024)  MiniBike has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Feb2024) "
  - name: "DEEPROOT"
    mitre_id: "S9063"
    url: "https://attack.mitre.org/software/S9063"
    type: "malware"
    stix_id: "malware--8460166d-ba74-405b-9944-c6f0365bc085"
    description: "DEEPROOT is a Linux backdoor written in Golang.(Citation: Mandiant_UNC1549_Nov2025) DEEPROOT is able to execute commands via a shell, enumerate systems, delete or download files, and exfiltrate data.(Citation: Mandiant_UNC1549_Nov2025) DEEPROOT was first observed in 2025.(Citation: Mandiant_UNC1549_Nov2025) DEEPROOT has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025)"
  - name: "SIGHTGRAB"
    mitre_id: "S9058"
    url: "https://attack.mitre.org/software/S9058"
    type: "malware"
    stix_id: "malware--53450019-1b2f-4912-bb3a-004bb1d7f177"
    description: "SIGHTGRAB is a Windows executable written in C that captures and stages stolen data on victim devices.(Citation: Mandiant_UNC1549_Nov2025) SIGHTGRAB was first observed in 2025 and has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025) "
  - name: "POLLBLEND"
    mitre_id: "S9066"
    url: "https://attack.mitre.org/software/S9066"
    type: "malware"
    stix_id: "malware--fa6cfe4c-e83b-4e19-b687-bd26e2b656e5"
    description: "POLLBLEND is a Windows tunneler written C++ that has utilized hardcoded C2 servers and leveraged hardcoded URI parameters for follow-on actions.(Citation: Mandiant_UNC1549_Nov2025) POLLBLEND was first observed in 2025 and has been affiliated with the cyber espionage threat group NIMBUS MANTICORE.(Citation: Mandiant_UNC1549_Nov2025)"
