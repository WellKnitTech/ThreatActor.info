name: "Knaithe"
aliases: ["KnYuan","Knaithe"]
description: "Knaithe is a Chinese-speaking operator assessed with moderate confidence to be operating from Zhuhai, China. The actor used Hermes Agent with DeepSeek, orchestrated via Telegram, for autonomous vulnerability scanning of Langflow and n8n instances. Separately, manual exploitation resulted in confirmed data exfiltration from three Citrix NetScaler targets and command execution on 11 Marimo Notebook endpoints."
