operations: ["2015-05","2016-09","Chinese Actors Use ‘3102’ Malware in Attacks on US Government and EU Media","During that campaign","From September 2016 through late November 2016","Operation “Seven Pointed Dagger”","a threat actor group used both the Trochilus RAT and a newly idenfied RAT we’ve named MoonWind to target organizations in Thailand","as well as the compiler used to generate the samples. The attackers compromised two legitimate Thai websites to host the malware","http://pages.arbornetworks.com/rs/082-KNA-087/images/ASERT%20Threat%20Intelligence%20Brief%202015-05%20PlugX%20Threat%20Activity%20in%20Myanmar.pdf","https://news.softpedia.com/news/trochilus-rat-evades-antivirus-detection-used-for-cyber-espionage-in-south-east-asia-498776.shtml","https://unit42.paloaltonetworks.com/chinese-actors-use-3102-malware-in-attacks-on-us-government-and-eu-media/","https://unit42.paloaltonetworks.com/evilgrab-delivered-by-watering-hole-attack-on-president-of-myanmars-website/","https://unit42.paloaltonetworks.com/unit42-trochilus-rat-new-moonwind-rat-used-attack-thai-utility-organizations/","including a utility organization. We chose the name ‘MoonWind’ based on debugging strings we saw within the samples","the threat actor identified as Group 27 used watering hole attacks on official Myanmar government websites to infect unsuspecting users with the PlugX malware (an RAT) when accessing information on the upcoming Myanmar elections.","which is a tactic this group has used in the past."]
