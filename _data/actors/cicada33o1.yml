description: Cicada3301 is a sophisticated Ransomware-as-a-Service (RaaS) group that
  emerged in June 2024. It’s written in Rust and supports cross-platform operations,
  targeting Windows, Linux, VMware ESXi, NAS, and even PowerPC systems. Technically,
  its ransomware shares many traits with BlackCat/ALPHV, such as use of ChaCha20 encryption,
  Rust-based structure, similar configuration interfaces, and methods for shutting
  down virtual machines and deleting snapshots. Cicada3301 also implements double-extortion
  tactics—encrypting or exfiltrating data and publishing it on Tor-based leak sites.
  The group appears to have established an affiliate program, demonstrated through
  their deployment interfaces and recruitment tactics via forums like RAMP. Operations
  are believed to be highly professional, possibly involving former ALPHV developers
  or affiliates.
