software:
  - name: "ECCENTRICBANDWAGON"
    mitre_id: "S0593"
    url: "https://attack.mitre.org/software/S0593"
    type: "malware"
    stix_id: "malware--e928333f-f3df-4039-9b8b-556c2add0e42"
    description: "ECCENTRICBANDWAGON is a remote access Trojan (RAT) used by North Korean cyber actors that was first identified in August 2020. It is a reconnaissance tool--with keylogging and screen capture functionality--used for information gathering on compromised systems.(Citation: CISA EB Aug 2020)"
  - name: "Net"
    mitre_id: "S0039"
    url: "https://attack.mitre.org/software/S0039"
    type: "tool"
    stix_id: "tool--03342581-f790-4f03-ba41-e82e67392e23"
    description: "The Net utility is a component of the Windows operating system. It is used in command-line operations for control of users, groups, services, and network connections. (Citation: Microsoft Net Utility)\n\nNet has a great deal of functionality, (Citation: Savill 1999) much of which is useful for an adversary, such as gathering system and network information for Discovery, moving laterally through SMB/Windows Admin Shares using <code>net use</code> commands, and interacting with services. The net1.exe"
  - name: "HOPLIGHT"
    mitre_id: "S0376"
    url: "https://attack.mitre.org/software/S0376"
    type: "malware"
    stix_id: "malware--454fe82d-6fd2-4ac6-91ab-28a33fe01369"
    description: "HOPLIGHT is a backdoor Trojan that has reportedly been used by the North Korean government.(Citation: US-CERT HOPLIGHT Apr 2019)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "KillDisk"
    mitre_id: "S0607"
    url: "https://attack.mitre.org/software/S0607"
    type: "malware"
    stix_id: "malware--e221eb77-1502-4129-af1d-fe1ad55e7ec6"
    description: "KillDisk is a disk-wiping tool designed to overwrite files with random data to render the OS unbootable. It was first observed as a component of BlackEnergy malware during cyber attacks against Ukraine in 2015. KillDisk has since evolved into stand-alone malware used by a variety of threat actors against additional targets in Europe and Latin America; in 2016 a ransomware component was also incorporated into some KillDisk variants.(Citation: KillDisk Ransomware)(Citation: ESEST Black Energy Jan 2"
  - name: "DarkComet"
    mitre_id: "S0334"
    url: "https://attack.mitre.org/software/S0334"
    type: "malware"
    stix_id: "malware--53ab35c2-d00e-491a-8753-41d35ae7e547"
    description: "DarkComet is a Windows remote administration tool and backdoor.(Citation: TrendMicro DarkComet Sept 2014)(Citation: Malwarebytes DarkComet March 2018)"
