description: Akira is a ransomware variant and ransomware deployment entity active
  since at least March 2023. [Arctic Wolf Akira 2023](https://arcticwolf.com/resources/blog/conti-and-akira-chained-together/)
  Akira uses compromised credentials to access single-factor external access mechanisms
  such as VPNs for initial access, then various publicly-available tools and techniques
  for lateral movement. [Arctic Wolf Akira 2023](https://arcticwolf.com/resources/blog/conti-and-akira-chained-together/)
  [Secureworks GOLD SAHARA](https://www.secureworks.com/research/threat-profiles/gold-sahara)
  Akira operations are associated with "double extortion" ransomware activity, where
  data is exfiltrated from victim environments prior to encryption, with threats to
  publish files if a ransom is not paid. Technical analysis of Akira ransomware indicates
  variants capable of targeting Windows or VMWare ESXi hypervisors and multiple overlaps
  with Conti ransomware. [BushidoToken Akira 2023](https://blog.bushidotoken.net/2023/09/tracking-adversaries-akira-another.html)
  [CISA Akira Ransomware APR 2024](https://www.cisa.gov/sites/default/files/2024-04/aa24-109a-stopransomware-akira-ransomware_2.pdf)
  [Cisco Akira Ransomware OCT 2024](https://blog.talosintelligence.com/akira-ransomware-continues-to-evolve/)
