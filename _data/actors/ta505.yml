    description: "AdFind is a free command-line query tool that can be used for gathering information from Active Directory.(Citation: Red Canary Hospital Thwarted Ryuk October 2020)(Citation: FireEye FIN6 Apr 2019)(Citation: FireEye Ryuk and Trickbot January 2019)"
  - name: "Clop"
    mitre_id: "S0611"
    url: "https://attack.mitre.org/software/S0611"
    type: "malware"
    stix_id: "malware--cad3ba95-8c89-4146-ab10-08daa813f9de"
    description: "Clop is a ransomware family that was first observed in February 2019 and has been used against retail, transportation and logistics, education, manufacturing, engineering, automotive, energy, financial, aerospace, telecommunications, professional and legal services, healthcare, and high tech industries. Clop is a variant of the CryptoMix ransomware.(Citation: Mcafee Clop Aug 2019)(Citation: Cybereason Clop Dec 2020)(Citation: Unit42 Clop April 2021) "
  - name: "Azorult"
    mitre_id: "S0344"
    url: "https://attack.mitre.org/software/S0344"
    type: "malware"
    stix_id: "malware--f9b05f33-d45d-4e4d-aafe-c208d38a0080"
    description: "Azorult is a commercial Trojan that is used to steal information from compromised hosts. Azorult has been observed in the wild as early as 2016.\nIn July 2018, Azorult was seen used in a spearphishing campaign against targets in North America. Azorult has been seen used for cryptocurrency theft. (Citation: Unit42 Azorult Nov 2018)(Citation: Proofpoint Azorult July 2018)"
  - name: "FlawedAmmyy"
    mitre_id: "S0381"
    url: "https://attack.mitre.org/software/S0381"
    type: "malware"
    stix_id: "malware--432555de-63bf-4f2a-a3fa-f720a4561078"
    description: "FlawedAmmyy is a remote access tool (RAT) that was first seen in early 2016. The code for FlawedAmmyy was based on leaked source code for a version of Ammyy Admin, a remote access software.(Citation: Proofpoint TA505 Mar 2018)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "Dridex"
    mitre_id: "S0384"
    url: "https://attack.mitre.org/software/S0384"
    type: "malware"
    stix_id: "malware--f01e2711-4b48-4192-a2e8-5f56c945ca19"
    description: "Dridex is a prolific banking Trojan that first appeared in 2014. By December 2019, the US Treasury estimated Dridex had infected computers in hundreds of banks and financial institutions in over 40 countries, leading to more than $100 million in theft. Dridex was created from the source code of the Bugat banking Trojan (also known as Cridex).(Citation: Dell Dridex Oct 2015)(Citation: Kaspersky Dridex May 2017)(Citation: Treasury EvilCorp Dec 2019)"
  - name: "TrickBot"
    mitre_id: "S0266"
    url: "https://attack.mitre.org/software/S0266"
    type: "malware"
    stix_id: "malware--00806466-754d-44ea-ad6f-0caf59cb8556"
    description: "TrickBot is a Trojan spyware program written in C++ that first emerged in September 2016 as a possible successor to Dyre. TrickBot was developed and initially used by Wizard Spider for targeting banking sites in North America, Australia, and throughout Europe; it has since been used against all sectors worldwide as part of \"big game hunting\" ransomware campaigns.(Citation: S2 Grupo TrickBot June 2017)(Citation: Fidelis TrickBot Oct 2016)(Citation: IBM TrickBot Nov 2016)(Citation: CrowdStrike Wiza"
  - name: "Get2"
    mitre_id: "S0460"
    url: "https://attack.mitre.org/software/S0460"
    type: "malware"
    stix_id: "malware--099ecff2-41b8-436d-843c-038a9aa9aa69"
    description: "Get2 is a downloader written in C++ that has been used by TA505 to deliver FlawedGrace, FlawedAmmyy, Snatch and SDBbot.(Citation: Proofpoint TA505 October 2019)"
  - name: "FlawedGrace"
    mitre_id: "S0383"
    url: "https://attack.mitre.org/software/S0383"
    type: "malware"
    stix_id: "malware--43155329-3edf-47a6-9a14-7dac899b01e4"
    description: "FlawedGrace is a fully featured remote access tool (RAT) written in C++ that was first observed in late 2017.(Citation: Proofpoint TA505 Jan 2019)"
  - name: "Cobalt Strike"
    mitre_id: "S0154"
    url: "https://attack.mitre.org/software/S0154"
    type: "malware"
    stix_id: "malware--a7881f21-e978-4fe4-af56-92c9416a2616"
    description: "Cobalt Strike is a commercial, full-featured, remote access tool that bills itself as “adversary simulation software designed to execute targeted attacks and emulate the post-exploitation actions of advanced threat actors”. Cobalt Strike’s interactive post-exploit capabilities cover the full range of ATT&CK tactics, all executed within a single, integrated system.(Citation: cobaltstrike manual)\n\nIn addition to its own capabilities, Cobalt Strike leverages the capabilities of other well-known tool"
  - name: "ServHelper"
    mitre_id: "S0382"
    url: "https://attack.mitre.org/software/S0382"
    type: "malware"
    stix_id: "malware--aae22730-e571-4d17-b037-65f2a3e26213"
    description: "ServHelper is a backdoor first observed in late 2018. The backdoor is written in Delphi and is typically delivered as a DLL file.(Citation: Proofpoint TA505 Jan 2019)"
  - name: "BloodHound"
    mitre_id: "S0521"
    url: "https://attack.mitre.org/software/S0521"
    type: "tool"
    stix_id: "tool--066b057c-944e-4cfc-b654-e3dfba04b926"
    description: "BloodHound is an Active Directory (AD) reconnaissance tool that can reveal hidden relationships and identify attack paths within an AD environment.(Citation: GitHub Bloodhound)(Citation: CrowdStrike BloodHound April 2018)(Citation: FoxIT Wocao December 2019)"
  - name: "Amadey"
    mitre_id: "S1025"
    url: "https://attack.mitre.org/software/S1025"
    type: "malware"
    stix_id: "malware--05318127-5962-444b-b900-a9dcfe0ff6e9"
    description: "Amadey is a Trojan bot that has been used since at least October 2018.(Citation: Korean FSI TA505 2020)(Citation: BlackBerry Amadey 2020)"
  - name: "SDBbot"
    mitre_id: "S0461"
    url: "https://attack.mitre.org/software/S0461"
    type: "malware"
    stix_id: "malware--92b03a94-7147-4952-9d5a-b4d24da7487c"
    description: "SDBbot is a backdoor with installer and loader components that has been used by TA505 since at least 2019.(Citation: Proofpoint TA505 October 2019)(Citation: IBM TA505 April 2020)"
  - name: "Net"
    mitre_id: "S0039"
    url: "https://attack.mitre.org/software/S0039"
    type: "tool"
    stix_id: "tool--03342581-f790-4f03-ba41-e82e67392e23"
    description: "The Net utility is a component of the Windows operating system. It is used in command-line operations for control of users, groups, services, and network connections. (Citation: Microsoft Net Utility)\n\nNet has a great deal of functionality, (Citation: Savill 1999) much of which is useful for an adversary, such as gathering system and network information for Discovery, moving laterally through SMB/Windows Admin Shares using <code>net use</code> commands, and interacting with services. The net1.exe"
  - name: "PowerSploit"
    mitre_id: "S0194"
    url: "https://attack.mitre.org/software/S0194"
    type: "tool"
    stix_id: "tool--13cd9151-83b7-410d-9f98-25d0f0d1d80d"
    description: "PowerSploit is an open source, offensive security framework comprised of PowerShell modules and scripts that perform a wide range of tasks related to penetration testing such as code execution, persistence, bypassing anti-virus, recon, and exfiltration. (Citation: GitHub PowerSploit May 2012) (Citation: PowerShellMagazine PowerSploit July 2014) (Citation: PowerSploit Documentation)"
