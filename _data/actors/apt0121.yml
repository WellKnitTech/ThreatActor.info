name: "Sidewinder"
aliases: ["Rattlesnake","Sidewinder","SideWinder","T-APT-04","响尾蛇 - APT-C-24"]
description: "Sidewinder is a suspected Indian threat actor group that has been active since at least 2012. They have been observed targeting government, military, and business entities throughout Asia, primarily focusing on Pakistan, China, Nepal, and Afghanistan. [ATT Sidewinder January 2021](https://cdn-cybersecurity.att.com/docs/global-perspective-of-the-sidewinder-apt.pdf) [Securelist APT Trends April 2018](https://securelist.com/apt-trends-report-q1-2018/85280/) [Cyble Sidewinder September 2020](https://cybleinc.com/2020/09/26/sidewinder-apt-targets-with-futuristic-tactics-and-techniques/)"
