software:
  - name: "BUBBLEWRAP"
    mitre_id: "S0043"
    url: "https://attack.mitre.org/software/S0043"
    type: "malware"
    stix_id: "malware--123bd7b3-675c-4b1a-8482-c55782b20e2b"
    description: "BUBBLEWRAP is a full-featured, second-stage backdoor used by the admin@338 group. It is set to run when the system boots and includes functionality to check, upload, and register plug-ins that can further enhance its capabilities. (Citation: FireEye admin@338)"
  - name: "LOWBALL"
    mitre_id: "S0042"
    url: "https://attack.mitre.org/software/S0042"
    type: "malware"
    stix_id: "malware--2a6f4c7b-e690-4cc7-ab6b-1f821fb6b80b"
    description: "LOWBALL is malware used by admin@338. It was used in August 2015 in email messages targeting Hong Kong-based media organizations. (Citation: FireEye admin@338)"
