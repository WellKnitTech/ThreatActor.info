software:
  - name: "MCMD"
    mitre_id: "S0500"
    url: "https://attack.mitre.org/software/S0500"
    type: "tool"
    stix_id: "tool--975737f1-b10d-476f-8bda-3ec26ea57172"
    description: "MCMD is a remote access tool that provides remote command shell capability used by Dragonfly.(Citation: Secureworks MCMD July 2019)"
  - name: "Net"
    mitre_id: "S0039"
    url: "https://attack.mitre.org/software/S0039"
    type: "tool"
    stix_id: "tool--03342581-f790-4f03-ba41-e82e67392e23"
    description: "The Net utility is a component of the Windows operating system. It is used in command-line operations for control of users, groups, services, and network connections. (Citation: Microsoft Net Utility)\n\nNet has a great deal of functionality, (Citation: Savill 1999) much of which is useful for an adversary, such as gathering system and network information for Discovery, moving laterally through SMB/Windows Admin Shares using <code>net use</code> commands, and interacting with services. The net1.exe"
  - name: "Impacket"
    mitre_id: "S0357"
    url: "https://attack.mitre.org/software/S0357"
    type: "tool"
    stix_id: "tool--26c87906-d750-42c5-946c-d4162c73fc7b"
    description: "Impacket is an open source collection of modules written in Python for programmatically constructing and manipulating network protocols. Impacket contains several tools for remote service execution, Kerberos manipulation, Windows credential dumping, packet sniffing, and relay attacks.(Citation: Impacket Tools)"
  - name: "CrackMapExec"
    mitre_id: "S0488"
    url: "https://attack.mitre.org/software/S0488"
    type: "tool"
    stix_id: "tool--c4810609-7da6-48ec-8057-1b70a7814db0"
    description: "CrackMapExec, or CME, is a post-exploitation tool developed in Python and designed for penetration testing against networks. CrackMapExec collects Active Directory information to conduct lateral movement through targeted networks.(Citation: CME Github September 2018)"
  - name: "Reg"
    mitre_id: "S0075"
    url: "https://attack.mitre.org/software/S0075"
    type: "tool"
    stix_id: "tool--cde2d700-9ed1-46cf-9bce-07364fe8b24f"
    description: "Reg is a Windows utility used to interact with the Windows Registry. It can be used at the command-line interface to query, add, modify, and remove information. (Citation: Microsoft Reg)\n\nUtilities such as Reg are known to be used by persistent threats. (Citation: Windows Commands JPCERT)"
  - name: "Backdoor.Oldrea"
    mitre_id: "S0093"
    url: "https://attack.mitre.org/software/S0093"
    type: "malware"
    stix_id: "malware--083bb47b-02c8-4423-81a2-f9ef58572974"
    description: "Backdoor.Oldrea is a modular backdoor that used by Dragonfly against energy companies since at least 2013. Backdoor.Oldrea was distributed via supply chain compromise, and included specialized modules to enumerate and map ICS-specific systems, processes, and protocols.(Citation: Symantec Dragonfly)(Citation: Gigamon Berserk Bear October 2021)(Citation: Symantec Dragonfly Sept 2017)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "PsExec"
    mitre_id: "S0029"
    url: "https://attack.mitre.org/software/S0029"
    type: "tool"
    stix_id: "tool--ff6caf67-ea1f-4895-b80e-4bb0fc31c6db"
    description: "PsExec is a free Microsoft tool that can be used to execute a program on another computer. It is used by IT administrators and attackers.(Citation: Russinovich Sysinternals)(Citation: SANS PsExec)"
  - name: "Trojan.Karagany"
    mitre_id: "S0094"
    url: "https://attack.mitre.org/software/S0094"
    type: "malware"
    stix_id: "malware--82cb34ba-02b5-432b-b2d2-07f55cbf674d"
    description: "Trojan.Karagany is a modular remote access tool used for recon and linked to Dragonfly. The source code for Trojan.Karagany originated from Dream Loader malware which was leaked in 2010 and sold on underground forums. (Citation: Symantec Dragonfly)(Citation: Secureworks Karagany July 2019)(Citation: Dragos DYMALLOY )"
  - name: "netsh"
    mitre_id: "S0108"
    url: "https://attack.mitre.org/software/S0108"
    type: "tool"
    stix_id: "tool--5a63f900-5e7e-4928-a746-dd4558e1df71"
    description: "netsh is a scripting utility used to interact with networking components on local or remote systems. (Citation: TechNet Netsh)"
