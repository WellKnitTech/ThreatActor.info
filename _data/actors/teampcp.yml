software:
  - name: "CanisterWorm"
    mitre_id: "S9042"
    url: "https://attack.mitre.org/software/S9042"
    type: "malware"
    stix_id: "malware--5b30f717-1d7b-4e91-a97d-be361d00aa5e"
    description: "CanisterWorm is a self-propagating malware that has been used by TeamPCP in credential harvesting and software supply chain campaigns since at least 2026. CanisterWorm has used npm credentials to infect software packages and propagate across developer ecosystems. CanisterWorm has a targeted wiper component and can use decentralized C2 infrastructure implemented via an Internet Computer Protocol (ICP) blockchain canister.(Citation: Aikido TeamPCP Telnyx MAR 2026)(Citation: Palo Alto TeamPCP MAR 20"
  - name: "Mini Shai-Hulud"
    mitre_id: "S9043"
    url: "https://attack.mitre.org/software/S9043"
    type: "malware"
    stix_id: "malware--7f211b2e-c008-4cac-9ea8-29bd7edd50a4"
    description: "Mini Shai-Hulud is a credential stealer and self-replicating supply chain worm, derived from Shai-Hulud, that has been used by TeamPCP to target Continuous Integration and Continuous Delivery/Deployment (CI/CD) workflows since at least 2026. Mini Shai-Hulud can compromise credentials across multiple cloud, container, and AI configuration file paths and can use stolen npm and GitHub OIDC tokens to spread to other packages maintained by the compromised user.  Mini Shai-Hulud also has a targeted wip"
  - name: "TeamPCP Cloud Stealer"
    mitre_id: "S9041"
    url: "https://attack.mitre.org/software/S9041"
    type: "malware"
    stix_id: "malware--fe5b2f0f-8fdc-459d-85b7-dd45c0217a0c"
    description: "The TeamPCP Cloud Stealer is a comprehensive filesystem credential stealer that can harvest, encrypt, and exfiltrate credentials from over 50 sensitive file paths across CI/CD, cloud, developer tooling, and container environments. The TeamPCP Cloud Stealer was the primary payload used by TeamPCP in March 2026 during early stages of a cascading supply chain campaign targeting CI/CD workflows.(Citation: Wiz Trivy Compromise MAR 2026)(Citation: Aqua Security Trivy Compromise MAR 2026)(Citation: Aqua"
