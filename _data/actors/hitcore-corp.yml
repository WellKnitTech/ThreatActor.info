name: "Hitcore Corp"
aliases: ["Hitcore Corp"]
description: "Hitcore claimed responsibility for a breach of Ukraine’s Air Alert app that sent false air-raid alerts to users in Kyiv on November 1. A Russian-language alert warned of a possible Oreshnik missile strike and linked to Hitcore’s Telegram channel. Zelensky described it as a Russian attack in a November 2 interview."
