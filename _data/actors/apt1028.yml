malware:
  - name: "KASPERAGENT and MICROPSIA"
  - name: "Desert Scorpion"
software:
  - name: "Micropsia"
    mitre_id: "S0339"
    url: "https://attack.mitre.org/software/S0339"
    type: "malware"
    stix_id: "malware--8c050cea-86e1-4b63-bf21-7af4fa483349"
    description: "Micropsia is a remote access tool written in Delphi.(Citation: Talos Micropsia June 2017)(Citation: Radware Micropsia July 2018)"
  - name: "Phenakite"
    mitre_id: "S1126"
    url: "https://attack.mitre.org/software/S1126"
    type: "malware"
    stix_id: "malware--f97e2718-af50-41df-811f-215ebab45691"
    description: "Phenakite is a mobile malware that is used by APT-C-23 to target iOS devices. According to several reports, Phenakite was developed to fill a tooling gap and to target those who owned iPhones instead of Windows desktops or Android phones.(Citation: sentinelone_israel_hamas_war)(Citation: fb_arid_viper)"
  - name: "Desert Scorpion"
    mitre_id: "S0505"
    url: "https://attack.mitre.org/software/S0505"
    type: "malware"
    stix_id: "malware--3271c107-92c4-442e-9506-e76d62230ee8"
    description: "Desert Scorpion is surveillanceware that has targeted the Middle East, specifically individuals located in Palestine. Desert Scorpion is suspected to have been operated by the threat actor APT-C-23.(Citation: Lookout Desert Scorpion) \n\nThere are multiple close variants of Desert Scorpion, such as VAMP(Citation: Unit42 VAMP 2017), GnatSpy(Citation: Trendmicro GnatSpy 2017), FrozenCell and SpyC23, which add some additional functionality but are not significantly different from the original malware."
  - name: "SpyC23"
    mitre_id: "S1195"
    url: "https://attack.mitre.org/software/S1195"
    type: "malware"
    stix_id: "malware--95811c0a-abe0-4e7f-a0cc-b0662ced5807"
    description: "SpyC23 is a mobile malware that has been used by APT-C-23 since at least 2017. SpyC23 has been observed primarily targeting Android devices in the Middle East.(Citation: welivesecurity_apt-c-23) \n\nThere are multiple close variants of SpyC23, such as VAMP(Citation: Unit42 VAMP 2017), GnatSpy(Citation: Trendmicro GnatSpy 2017), Desert Scorpion and FrozenCell, which add some additional functionality but are not significantly different from the original malware."
  - name: "FrozenCell"
    mitre_id: "S0577"
    url: "https://attack.mitre.org/software/S0577"
    type: "malware"
    stix_id: "malware--96ea1e13-d50f-45f1-b0cf-4ac9bc5a2d62"
    description: "FrozenCell is the mobile component of a family of surveillanceware, with a corresponding desktop component known as KasperAgent and Micropsia.(Citation: Lookout FrozenCell) \n\nThere are multiple close variants of FrozenCell, such as VAMP(Citation: Unit42 VAMP 2017), GnatSpy(Citation: Trendmicro GnatSpy 2017), Desert Scorpion and SpyC23, which add some additional functionality but are not significantly different from the original malware."
