name: "APT-C-23"
aliases: ["APT-C-23","APT_C_23","Arid Viper","AridViper","Bearded Barbie","Big Bang APT","Desert Falcon","Grey Karkadann","Mantis","TAG-63","Two-tailed Scorpion"]
description: "APT-C-23 is a threat group that has been active since at least 2014. [symantec_mantis](https://web.archive.org/web/20231227054130/https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/mantis-palestinian-attacks) APT-C-23 has primarily focused its operations on the Middle East, including Israeli military assets. APT-C-23 has developed mobile spyware targeting Android and iOS devices since 2017. [welivesecurity_apt-c-23](https://web.archive.org/web/20201123042131/www.welivesecurity.com/2020/09/30/aptc23-group-evolves-its-android-spyware/)"
