name: "APT5"
aliases: ["APT5","ATG48","Auriga","Backdoor-DPD","Bottle","BRONZE FLEETWOOD","Bronze Fleetwood","COVENANT","CYSERVICE","Keyhole Panda","KEYHOLE PANDA","MANGANESE","Manganese","Mulberry Typhoon","Poisoned Flight","Red Horus","Red Naga","TABCTENG","TEMP.Bottle","TG-2754","UNC2630","BASALT CASTLE"]
description: "APT5 is a China-based espionage actor that has been active since at least 2007 primarily targeting the telecommunications, aerospace, and defense industries throughout the U.S., Europe, and Asia. APT5 has displayed advanced tradecraft and significant interest in compromising networking devices and their underlying software including through the use of zero-day exploits. [NSA APT5 Citrix Threat Hunting December 2022](https://media.defense.gov/2022/Dec/13/2003131586/-1/-1/0/CSA-APT5-CITRIXADC-V1.PDF) [Microsoft East Asia Threats September 2023](https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RW1aFyW) [Mandiant Pulse Secure Zero-Day April 2021](https://www.mandiant.com/resources/blog/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day) [Mandiant Pulse Secure Update May 2021](https://www.mandiant.com/resources/blog/updates-on-chinese-apt-compromising-pulse-secure-vpn-devices) [FireEye Southeast Asia Threat Landscape March 2015](https://web.archive.org/web/20220122121143/https://www.fireeye.com/content/dam/fireeye-www/current-threats/pdfs/rpt-southeast-asia-threat-landscape.pdf) [Mandiant Advanced Persistent Threats](https://www.mandiant.com/resources/insights/apt-groups) "
