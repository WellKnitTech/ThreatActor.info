software:
  - name: "Tasklist"
    mitre_id: "S0057"
    url: "https://attack.mitre.org/software/S0057"
    type: "tool"
    stix_id: "tool--2e45723a-31da-4a7e-aaa6-e01998a6788f"
    description: "The Tasklist utility displays a list of applications and services with their Process IDs (PID) for all tasks running on either a local or a remote computer. It is packaged with Windows operating systems and can be executed from the command-line interface. (Citation: Microsoft Tasklist)"
  - name: "PoisonIvy"
    mitre_id: "S0012"
    url: "https://attack.mitre.org/software/S0012"
    type: "malware"
    stix_id: "malware--b42378e0-f147-496f-992a-26a49705395b"
    description: "PoisonIvy is a popular remote access tool (RAT) that has been used by many groups.(Citation: FireEye Poison Ivy)(Citation: Symantec Elderwood Sept 2012)(Citation: Symantec Darkmoon Aug 2005)"
  - name: "RAPIDPULSE"
    mitre_id: "S1113"
    url: "https://attack.mitre.org/software/S1113"
    type: "malware"
    stix_id: "malware--880f7b3e-ad27-4158-8b03-d44c9357950b"
    description: "RAPIDPULSE is a web shell that exists as a modification to a legitimate Pulse Secure file that has been used by APT5 since at least 2021.(Citation: Mandiant Pulse Secure Update May 2021)"
  - name: "PcShare"
    mitre_id: "S1050"
    url: "https://attack.mitre.org/software/S1050"
    type: "tool"
    stix_id: "tool--3a53b207-aba2-4a2b-9cdb-273d633669e7"
    description: "PcShare is an open source remote access tool that has been modified and used by Chinese threat actors, most notably during the FunnyDream campaign since late 2018.(Citation: Bitdefender FunnyDream Campaign November 2020)(Citation: GitHub PcShare 2014)"
  - name: "Mimikatz"
    mitre_id: "S0002"
    url: "https://attack.mitre.org/software/S0002"
    type: "tool"
    stix_id: "tool--afc079f3-c0ea-4096-b75d-3f05338b7f60"
    description: "Mimikatz is a credential dumper capable of obtaining plaintext Windows account logins and passwords, along with many other features that make it useful for testing the security of networks. (Citation: Deply Mimikatz) (Citation: Adsecurity Mimikatz Guide)"
  - name: "SLOWPULSE"
    mitre_id: "S1104"
    url: "https://attack.mitre.org/software/S1104"
    type: "malware"
    stix_id: "malware--f8fc98ac-ad6d-44db-b6e2-f0c6eb4eace4"
    description: "SLOWPULSE is a malware that was used by APT5 as early as 2020 including against U.S. Defense Industrial Base (DIB) companies. SLOWPULSE has several variants and can modify legitimate Pulse Secure VPN files in order to log credentials and bypass single and two-factor authentication flows.(Citation: Mandiant Pulse Secure Zero-Day April 2021)"
  - name: "SLIGHTPULSE"
    mitre_id: "S1110"
    url: "https://attack.mitre.org/software/S1110"
    type: "malware"
    stix_id: "malware--d1008b78-960c-4b36-bdc4-39a734e1e4e3"
    description: "SLIGHTPULSE is a web shell that was used by APT5 as early as 2020 including against Pulse Secure VPNs at US Defense Industrial Base (DIB) entities.(Citation: Mandiant Pulse Secure Zero-Day April 2021)"
  - name: "Skeleton Key"
    mitre_id: "S0007"
    url: "https://attack.mitre.org/software/S0007"
    type: "malware"
    stix_id: "malware--89f63ae4-f229-4a5c-95ad-6f22ed2b5c49"
    description: "Skeleton Key is malware used to inject false credentials into domain controllers with the intent of creating a backdoor password. (Citation: Dell Skeleton) Functionality similar to Skeleton Key is included as a module in Mimikatz."
  - name: "Net"
    mitre_id: "S0039"
    url: "https://attack.mitre.org/software/S0039"
    type: "tool"
    stix_id: "tool--03342581-f790-4f03-ba41-e82e67392e23"
    description: "The Net utility is a component of the Windows operating system. It is used in command-line operations for control of users, groups, services, and network connections. (Citation: Microsoft Net Utility)\n\nNet has a great deal of functionality, (Citation: Savill 1999) much of which is useful for an adversary, such as gathering system and network information for Discovery, moving laterally through SMB/Windows Admin Shares using <code>net use</code> commands, and interacting with services. The net1.exe"
  - name: "PACEMAKER"
    mitre_id: "S1109"
    url: "https://attack.mitre.org/software/S1109"
    type: "malware"
    stix_id: "malware--647215dd-29a6-4528-b354-ca8b5e08fca1"
    description: "PACEMAKER is a credential stealer that was used by APT5 as early as 2020 including activity against US Defense Industrial Base (DIB) companies.(Citation: Mandiant Pulse Secure Zero-Day April 2021)"
  - name: "gh0st RAT"
    mitre_id: "S0032"
    url: "https://attack.mitre.org/software/S0032"
    type: "malware"
    stix_id: "malware--88c621a7-aef9-4ae0-94e3-1fc87123eb24"
    description: "gh0st RAT is a remote access tool (RAT). The source code is public and it has been used by multiple groups.(Citation: FireEye Hacking Team)(Citation: Arbor Musical Chairs Feb 2018)(Citation: Nccgroup Gh0st April 2018)"
  - name: "PULSECHECK"
    mitre_id: "S1108"
    url: "https://attack.mitre.org/software/S1108"
    type: "malware"
    stix_id: "malware--9a097d18-d15f-4635-a4f1-189df7efdc40"
    description: "PULSECHECK is a web shell written in Perl that was used by APT5 as early as 2020 including against Pulse Secure VPNs at US Defense Industrial Base (DIB) companies.(Citation: Mandiant Pulse Secure Zero-Day April 2021)"
  - name: "netstat"
    mitre_id: "S0104"
    url: "https://attack.mitre.org/software/S0104"
    type: "tool"
    stix_id: "tool--4664b683-f578-434f-919b-1c1aad2a1111"
    description: "netstat is an operating system utility that displays active TCP connections, listening ports, and network statistics. (Citation: TechNet Netstat)"
