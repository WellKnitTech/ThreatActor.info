name: "menuPass"
aliases: ["APT10","ATK41","BRONZE RIVERSIDE","Cicada","Cloud Hopper","CVNX","G0045","Granite Taurus","happyyongzi","HOGFISH","menuPass","Menupass Team","POTASSIUM","Purple Typhoon","Red Apollo","Stone Panda","STONE PANDA","TA429"]
description: "menuPass is a threat group that has been active since at least 2006. Individual members of menuPass are known to have acted in association with the Chinese Ministry of State Security's (MSS) Tianjin State Security Bureau and worked for the Huaying Haitai Science and Technology Development Company. [DOJ APT10 Dec 2018](https://www.justice.gov/opa/pr/two-chinese-hackers-associated-ministry-state-security-charged-global-computer-intrusion) [District Court of NY APT10 Indictment December 2018](https://www.justice.gov/opa/page/file/1122671/download)\n\nmenuPass has targeted healthcare, defense, aerospace, finance, maritime, biotechnology, energy, and government sectors globally, with an emphasis on Japanese organizations. In 2016 and 2017, the group is known to have targeted managed IT service providers (MSPs), manufacturing and mining companies, and a university. [Palo Alto menuPass Feb 2017](http://researchcenter.paloaltonetworks.com/2017/02/unit42-menupass-returns-new-malware-new-attacks-japanese-academics-organizations/) [Crowdstrike CrowdCast Oct 2013](https://www.slideshare.net/slideshow/crowd-casts-monthly-you-have-an-adversary-problem/27262315) [FireEye Poison Ivy](https://www.mandiant.com/sites/default/files/2021-09/rpt-poison-ivy.pdf) [PWC Cloud Hopper April 2017](https://web.archive.org/web/20220224041316/https:/www.pwc.co.uk/cyber-security/pdf/cloud-hopper-report-final-v4.pdf) [FireEye APT10 April 2017](https://www.fireeye.com/blog/threat-research/2017/04/apt10_menupass_grou.html) [DOJ APT10 Dec 2018](https://www.justice.gov/opa/pr/two-chinese-hackers-associated-ministry-state-security-charged-global-computer-intrusion) [District Court of NY APT10 Indictment December 2018](https://www.justice.gov/opa/page/file/1122671/download)"
