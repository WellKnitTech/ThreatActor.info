    stix_id: "malware--292eb0c5-b8e8-4af6-9e8f-0fda6b4528d3"
    description: "Ecipekac is a multi-layer loader that has been used by menuPass since at least 2019 including use as a loader for P8RAT, SodaMaster, and FYAnti.(Citation: Securelist APT10 March 2021)"
