software:
  - name: "P.A.S. Webshell"
    mitre_id: "S0598"
    url: "https://attack.mitre.org/software/S0598"
    type: "malware"
    stix_id: "malware--4800d0f9-00aa-47cd-a4d2-92198585b8fd"
    description: "P.A.S. Webshell is a publicly available multifunctional PHP webshell in use since at least 2016 that provides remote access and execution on target web servers.(Citation: ANSSI Sandworm January 2021)"
  - name: "CrackMapExec"
    mitre_id: "S0488"
    url: "https://attack.mitre.org/software/S0488"
    type: "tool"
    stix_id: "tool--c4810609-7da6-48ec-8057-1b70a7814db0"
    description: "CrackMapExec, or CME, is a post-exploitation tool developed in Python and designed for penetration testing against networks. CrackMapExec collects Active Directory information to conduct lateral movement through targeted networks.(Citation: CME Github September 2018)"
  - name: "Responder"
    mitre_id: "S0174"
    url: "https://attack.mitre.org/software/S0174"
    type: "tool"
    stix_id: "tool--a1dd2dbd-1550-44bf-abcc-1a4c52e97719"
    description: "Responder is an open source tool used for LLMNR, NBT-NS and MDNS poisoning, with built-in HTTP/SMB/MSSQL/FTP/LDAP rogue authentication server supporting NTLMv1/NTLMv2/LMv2, Extended Security NTLMSSP and Basic HTTP authentication. (Citation: GitHub Responder)"
  - name: "ngrok"
    mitre_id: "S0508"
    url: "https://attack.mitre.org/software/S0508"
    type: "tool"
    stix_id: "tool--2f7f03bb-f367-4a5a-ad9b-310a12a48906"
    description: "ngrok is a legitimate reverse proxy tool that can create a secure tunnel to servers located behind firewalls or on local machines that do not have a public IP. ngrok has been leveraged by threat actors in several campaigns including use for lateral movement and data exfiltration.(Citation: Zdnet Ngrok September 2018)(Citation: FireEye Maze May 2020)(Citation: Cyware Ngrok May 2019)(Citation: MalwareBytes LazyScripter Feb 2021)"
  - name: "reGeorg"
    mitre_id: "S1187"
    url: "https://attack.mitre.org/software/S1187"
    type: "malware"
    stix_id: "malware--0e17b066-50dd-4c2f-83bf-205c5eb2bb34"
    description: "reGeorg is an open-source web shell written in Python that can be used as a proxy to bypass firewall rules and tunnel data in and out of targeted networks.(Citation: Fortinet reGeorg MAR 2019)(Citation: GitHub reGeorg 2016)"
  - name: "WhisperGate"
    mitre_id: "S0689"
    url: "https://attack.mitre.org/software/S0689"
    type: "malware"
    stix_id: "malware--49fee0b0-390e-4bde-97f8-97ed46bd19b7"
    description: "WhisperGate is a multi-stage wiper designed to look like ransomware that has been used against multiple government, non-profit, and information technology organizations in Ukraine since at least January 2022.(Citation: Cybereason WhisperGate February 2022)(Citation: Unit 42 WhisperGate January 2022)(Citation: Microsoft WhisperGate January 2022)"
  - name: "Saint Bot"
    mitre_id: "S1018"
    url: "https://attack.mitre.org/software/S1018"
    type: "malware"
    stix_id: "malware--7724581b-06ff-4d2b-b77c-80dc8d53070b"
    description: "Saint Bot is a .NET downloader that has been used by Saint Bear since at least March 2021.(Citation: Malwarebytes Saint Bot April 2021)(Citation: Palo Alto Unit 42 OutSteel SaintBot February 2022 )"
  - name: "PsExec"
    mitre_id: "S0029"
    url: "https://attack.mitre.org/software/S0029"
    type: "tool"
    stix_id: "tool--ff6caf67-ea1f-4895-b80e-4bb0fc31c6db"
    description: "PsExec is a free Microsoft tool that can be used to execute a program on another computer. It is used by IT administrators and attackers.(Citation: Russinovich Sysinternals)(Citation: SANS PsExec)"
  - name: "Rclone"
    mitre_id: "S1040"
    url: "https://attack.mitre.org/software/S1040"
    type: "tool"
    stix_id: "tool--59096109-a1dd-463b-87e7-a8d110fe3a79"
    description: "Rclone is a command line program for syncing files with cloud storage services such as Dropbox, Google Drive, Amazon S3, and MEGA. Rclone has been used in a number of ransomware campaigns, including those associated with the Conti and DarkSide Ransomware-as-a-Service operations.(Citation: Rclone)(Citation: Rclone Wars)(Citation: Detecting Rclone)(Citation: DarkSide Ransomware Gang)(Citation: DFIR Conti Bazar Nov 2021)"
  - name: "BloodHound"
    mitre_id: "S0521"
    url: "https://attack.mitre.org/software/S0521"
    type: "tool"
    stix_id: "tool--066b057c-944e-4cfc-b654-e3dfba04b926"
    description: "BloodHound is an Active Directory (AD) reconnaissance tool that can reveal hidden relationships and identify attack paths within an AD environment.(Citation: GitHub Bloodhound)(Citation: CrowdStrike BloodHound April 2018)(Citation: FoxIT Wocao December 2019)"
  - name: "Impacket"
    mitre_id: "S0357"
    url: "https://attack.mitre.org/software/S0357"
    type: "tool"
    stix_id: "tool--26c87906-d750-42c5-946c-d4162c73fc7b"
    description: "Impacket is an open source collection of modules written in Python for programmatically constructing and manipulating network protocols. Impacket contains several tools for remote service execution, Kerberos manipulation, Windows credential dumping, packet sniffing, and relay attacks.(Citation: Impacket Tools)"
